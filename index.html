<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI文创作品展</title>
<style>
  :root {
    --warm-bg: #FDF6E3;
    --card-bg: #FFF8E7;
    --accent: #E8A02C;
    --red: #B8332C;
    --brown: #7A4A1A;
    --blue: #2C5F8D;
    --light-line: #E8D9B0;
    --text: #4A3F35;
    --shadow: rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--warm-bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    background: linear-gradient(135deg, #2C5F8D 0%, #B8332C 50%, #E8A02C 100%);
    padding: 40px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .site-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 2px,
      transparent 2px,
      transparent 40px
    );
  }
  .site-header h1 {
    font-size: 2.4rem;
    color: white;
    letter-spacing: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    position: relative;
  }
  .site-header p {
    color: rgba(255,255,255,0.85);
    margin-top: 8px;
    font-size: 1rem;
    letter-spacing: 2px;
    position: relative;
  }
  .flag-bar {
    display: flex;
    height: 4px;
    margin-top: 20px;
    border-radius: 2px;
    overflow: hidden;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
    position: relative;
  }
  .flag-bar span { flex: 1; }
  .fb1 { background: #2C5F8D; }
  .fb2 { background: #FFFFFF; }
  .fb3 { background: #B8332C; }
  .fb4 { background: #2E7D4A; }
  .fb5 { background: #E8A02C; }

  /* ── Toolbar ── */
  .toolbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn-scan {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .btn-scan svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .btn-scan-badge {
    background: var(--blue);
    box-shadow: 0 2px 8px rgba(44,95,141,0.3);
  }
  .btn-scan-badge:hover {
    background: #234D73;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(44,95,141,0.4);
  }
  .btn-scan-postcard {
    background: var(--red);
    box-shadow: 0 2px 8px rgba(184,51,44,0.3);
  }
  .btn-scan-postcard:hover {
    background: #9A2820;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(184,51,44,0.4);
  }
  .stats {
    font-size: 0.88rem;
    color: #8A7B5C;
    letter-spacing: 1px;
  }
  .stats strong { color: var(--red); font-size: 1.05rem; }
  .toolbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .view-toggle {
    display: flex;
    gap: 4px;
    background: white;
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .view-btn {
    padding: 7px 14px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 6px;
    font-size: 0.85rem;
    color: var(--brown);
    transition: all 0.2s;
  }
  .view-btn.active { background: var(--accent); color: white; }
  .btn-print {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .btn-print:hover { transform: translateY(-1px); }
  .btn-print:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .btn-print svg { width: 16px; height: 16px; fill: currentColor; }
  .btn-print-postcard { background: var(--brown); }
  .btn-print-postcard:hover { background: #5C4A30; }
  .btn-print-badge { background: var(--blue); }
  .btn-print-badge:hover { background: #234D73; }

  /* ── Tab Bar ── */
  .tab-bar {
    max-width: 1200px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    border-bottom: 2px solid var(--light-line);
  }
  .tab-btn {
    padding: 10px 28px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    color: #8A7B5C;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .tab-badge-indicator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    background: var(--accent);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    border-radius: 10px;
    padding: 0 5px;
  }
  .tab-btn:not(.active) .tab-badge-indicator { background: #C9B98F; }

  /* ── Badge Gallery ── */
  .badge-gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: flex-start;
  }
  .badge-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    cursor: pointer;
  }
  .badge-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px dashed var(--red);
    background: #E8DFC7;
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8A7B5C;
    font-size: 0.78rem;
    text-align: center;
  }
  .badge-circle img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .badge-card:hover .badge-circle {
    transform: scale(1.06) rotate(2deg);
    box-shadow: 0 10px 28px rgba(184,51,44,0.25);
    border-color: var(--accent);
    border-style: solid;
  }
  .badge-card:hover .badge-circle img { transform: scale(1.1); }
  .badge-name {
    font-size: 0.88rem;
    color: var(--brown);
    font-weight: 700;
    max-width: 150px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.5px;
  }
  .badge-num-tag {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    background: var(--accent);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Postcard Gallery ── */
  .gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 28px;
  }
  .gallery.list-view {
    grid-template-columns: 1fr;
    max-width: 800px;
  }

  .postcard {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px var(--shadow);
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
  }
  .postcard:hover {
    transform: translateY(-4px) rotate(-0.5deg);
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  }
  .postcard-img-wrap {
    position: relative;
    width: 100%;
    padding-top: 66%;
    overflow: hidden;
    background: #E8DFC7;
  }
  .postcard-img-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  .postcard:hover .postcard-img-wrap img { transform: scale(1.05); }
  .postcard-border {
    position: absolute;
    inset: 6px;
    border: 2px solid rgba(232,160,44,0.5);
    border-radius: 4px;
    pointer-events: none;
    z-index: 1;
  }
  .postcard-info {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .postcard-title { font-weight: 700; color: var(--red); font-size: 1rem; letter-spacing: 1px; }
  .postcard-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: var(--accent);
    color: white;
    font-size: 0.8rem;
    font-weight: 700;
    border-radius: 50%;
  }
  .postcard-flag { display: flex; height: 3px; overflow: hidden; }
  .postcard-flag span { flex: 1; }
  .stamp-deco {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 44px;
    height: 54px;
    background: rgba(255,255,255,0.85);
    border: 1.5px dashed var(--red);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--red);
    text-align: center;
    line-height: 1.3;
    z-index: 2;
    backdrop-filter: blur(4px);
  }

  /* ── Empty State ── */
  .empty-state {
    grid-column: 1 / -1;
    max-width: 500px;
    margin: 60px auto;
    text-align: center;
    padding: 60px 30px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px var(--shadow);
  }
  .badge-gallery .empty-state { margin: 60px auto; }
  .empty-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.6; }
  .empty-state h2 { color: var(--brown); margin-bottom: 12px; font-size: 1.3rem; }
  .empty-state p { color: #8A7B5C; line-height: 1.8; font-size: 0.95rem; }

  /* ── Hidden ── */
  .hidden { display: none !important; }

  /* ── Badge Lightbox ── */
  .badge-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 40px;
    backdrop-filter: blur(8px);
  }
  .badge-lightbox.active { display: flex; }
  .badge-lb-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: lbIn 0.3s ease;
  }
  .badge-lb-circle {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px dashed rgba(232,160,44,0.8);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .badge-lb-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge-lb-title { color: white; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .badge-lb-meta { color: rgba(255,255,255,0.7); font-size: 0.9rem; }

  /* ── Postcard Lightbox ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 40px;
    backdrop-filter: blur(8px);
  }
  .lightbox.active { display: flex; }
  .lightbox-inner {
    max-width: 900px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: lbIn 0.3s ease;
  }
  @keyframes lbIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .lightbox-img {
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
    background: #E8DFC7;
    display: block;
  }
  .lightbox-detail {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .lightbox-detail h3 { color: var(--red); font-size: 1.3rem; letter-spacing: 2px; }
  .lightbox-detail .lb-meta { color: #8A7B5C; font-size: 0.9rem; }
  .lb-close {
    position: fixed;
    top: 20px; right: 24px;
    width: 44px; height: 44px;
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    transition: all 0.2s;
  }
  .lb-close:hover { background: var(--red); border-color: var(--red); }
  .lb-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px; height: 48px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 1.4rem;
    cursor: pointer;
    z-index: 1001;
    transition: all 0.2s;
  }
  .lb-nav:hover { background: rgba(255,255,255,0.3); }
  .lb-prev { left: 16px; }
  .lb-next { right: 16px; }
  .lb-back-preview {
    border-top: 1px dashed var(--light-line);
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    min-height: 140px;
  }
  .lb-back-divider { background: var(--accent); width: 1px; }
  .lb-msg-area { padding-right: 16px; }
  .lb-msg-title { color: var(--red); font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
  .lb-msg-lines {
    height: 80px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 22px, #E8D9B0 22px, #E8D9B0 22.5px);
  }
  .lb-addr-area { padding-left: 16px; position: relative; }
  .lb-stamp {
    position: absolute; top: 0; right: 0;
    width: 40px; height: 50px;
    border: 1.5px dashed var(--red);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--red);
  }
  .lb-to { font-size: 0.85rem; color: var(--red); font-weight: 700; letter-spacing: 1px; }
  .lb-addr-lines {
    margin-top: 30px;
    height: 50px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 22px, #C9B98F 22px, #C9B98F 22.5px);
  }

  /* ── Footer ── */
  .site-footer {
    text-align: center;
    padding: 30px 20px;
    color: #8A7B5C;
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  /* ── Postcard Print Overlay ── */
  .print-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }
  .print-overlay.active { display: block; }
  .print-toolbar {
    position: sticky;
    top: 0; z-index: 2001;
    background: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .print-toolbar h3 { color: var(--red); font-size: 1.1rem; letter-spacing: 1px; }
  .print-toolbar-btns { display: flex; gap: 10px; }
  .print-toolbar .pt-btn {
    padding: 8px 24px;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pt-btn-print { background: var(--red); color: white; }
  .pt-btn-print:hover { background: #9A2820; }
  .pt-btn-close { background: #eee; color: var(--text); }
  .pt-btn-close:hover { background: #ddd; }
  .print-pages {
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding-bottom: 40px;
  }
  .print-page {
    width: 148mm;
    height: 105mm;
    background: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    box-sizing: border-box;
  }
  .print-page-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.7);
    margin-bottom: 4px;
    text-align: center;
  }
  .print-pair { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  /* Postcard front/back print */
  .prt-front {
    background: #FFF8E7;
    padding: 4mm;
    display: flex;
    flex-direction: column;
    width: 100%; height: 100%;
    box-sizing: border-box;
  }
  .prt-front-image {
    flex: 1;
    background-color: #E8DFC7;
    border: 1px solid #E8A02C;
    border-radius: 2mm;
    overflow: hidden;
    position: relative;
  }
  .prt-front-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .prt-front-strip {
    margin-top: 2mm;
    height: 6mm;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2mm;
    font-size: 8pt;
    color: #7A4A1A;
  }
  .prt-front-strip .prt-title { font-weight: 700; color: #B8332C; letter-spacing: 1px; }
  .prt-front-strip .prt-flag { display: flex; height: 3mm; width: 30mm; border-radius: 1mm; overflow: hidden; }
  .prt-front-strip .prt-flag span { flex: 1; }
  .prt-back {
    background: #FFFBF0;
    padding: 5mm 6mm;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    width: 100%; height: 100%;
    box-sizing: border-box;
  }
  .prt-back-divider { background: #E8A02C; width: 1px; }
  .prt-msg-area { padding-right: 4mm; display: flex; flex-direction: column; }
  .prt-msg-title { color: #B8332C; font-size: 10pt; font-weight: 700; margin-bottom: 2mm; letter-spacing: 1px; }
  .prt-msg-lines {
    flex: 1;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 7mm, #E8D9B0 7mm, #E8D9B0 7.2mm);
  }
  .prt-msg-foot { font-size: 7.5pt; color: #8A7B5C; text-align: right; margin-top: 1mm; font-style: italic; }
  .prt-addr-area { padding-left: 4mm; display: flex; flex-direction: column; position: relative; }
  .prt-stamp {
    position: absolute; top: 0; right: 0;
    width: 22mm; height: 28mm;
    border: 1.5px dashed #B8332C;
    color: #B8332C;
    font-size: 7pt;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.4; border-radius: 1mm;
  }
  .prt-to-label { font-size: 10pt; color: #B8332C; font-weight: 700; margin-bottom: 2mm; letter-spacing: 1px; }
  .prt-addr-lines {
    margin-top: 18mm; flex: 1;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 8mm, #C9B98F 8mm, #C9B98F 8.2mm);
    max-height: 50mm;
  }
  .prt-postcode { margin-top: 2mm; display: flex; gap: 1.2mm; }
  .prt-postcode .prt-box { width: 7mm; height: 9mm; border: 1px solid #B8332C; border-radius: 0.5mm; }
  .prt-course-foot { margin-top: auto; padding-top: 2mm; font-size: 7pt; color: #8A7B5C; text-align: right; letter-spacing: 0.5px; }

  /* ── Postcard @page & print ── */
  /* ── Badge Print Overlay ── */
  .badge-print-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }
  .badge-print-overlay.active { display: block; }

  /* A4 badge page (screen preview) */
  .badge-print-a4 {
    width: 210mm;
    height: 297mm;
    background: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }
  .badge-on-page {
    position: absolute;
    width: 75mm;
    height: 75mm;
    border-radius: 50%;
    overflow: hidden;
    background-color: #E8DFC7;
    border: 0.4mm dashed #B8332C;
  }
  .badge-on-page::after {
    content: "";
    position: absolute;
    width: 58mm; height: 58mm;
    border-radius: 50%;
    left: 8.5mm; top: 8.5mm;
    border: 0.2mm dotted rgba(184,51,44,.35);
    pointer-events: none;
  }
  .badge-on-page img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bap1 { left: 27.5mm; top: 31mm; }
  .bap2 { left: 107.5mm; top: 31mm; }
  .bap3 { left: 27.5mm; top: 111mm; }
  .bap4 { left: 107.5mm; top: 111mm; }
  .bap5 { left: 27.5mm; top: 191mm; }
  .bap6 { left: 107.5mm; top: 191mm; }
  .badge-corner-info {
    position: absolute;
    top: 6mm; left: 6mm;
    font-size: 8pt; color: #8A7B5C;
  }
  .badge-corner-info b { color: #B8332C; }
  .badge-page-no {
    position: absolute;
    bottom: 6mm; right: 8mm;
    font-size: 8pt; color: #8A7B5C;
  }
  .badge-print-pair {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  @media print {
    body > *:not(.print-overlay):not(.badge-print-overlay) { display: none !important; }
    .print-overlay:not(.active)       { display: none !important; }
    .badge-print-overlay:not(.active) { display: none !important; }
    .print-overlay.active, .badge-print-overlay.active {
      display: block !important;
      position: static;
      background: none;
      backdrop-filter: none;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .print-toolbar { display: none !important; }
    /* postcard */
    .print-pages { padding: 0; gap: 0; }
    .print-pair { gap: 0; }
    .print-page-label { display: none !important; }
    .print-page {
      box-shadow: none;
      page-break-after: always;
      page-break-inside: avoid;
      width: 148mm; height: 105mm;
    }
    /* badge */
    .badge-print-pages { padding: 0; gap: 0; }
    .badge-print-pair { gap: 0; }
    .badge-print-a4 {
      box-shadow: none;
      page-break-after: always;
      page-break-inside: avoid;
      width: 210mm; height: 297mm;
      margin: 0;
    }
    .badge-on-page::after { display: none; }
  }

  @media (max-width: 600px) {
    .site-header h1 { font-size: 1.6rem; letter-spacing: 3px; }
    .gallery { grid-template-columns: 1fr; padding: 0 12px 40px; }
    .toolbar { padding: 14px 12px 0; }
    .view-toggle { display: none; }
    .badge-gallery { padding: 16px 12px 40px; gap: 16px; }
    .badge-circle { width: 120px; height: 120px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <h1>AI文创作品展</h1>
  <p>AI 文创课 · 学员作品集</p>
  <div class="flag-bar">
    <span class="fb1"></span><span class="fb2"></span><span class="fb3"></span><span class="fb4"></span><span class="fb5"></span>
  </div>
</header>

<div class="toolbar">
  <!-- 选择徽章文件夹 -->
  <button class="btn-scan btn-scan-badge" onclick="scanBadgeFolder()">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    选择徽章文件夹
  </button>
  <!-- 选择明信片文件夹 -->
  <button class="btn-scan btn-scan-postcard" onclick="scanPostcardFolder()">
    <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
    选择明信片文件夹
  </button>
  <span class="stats" id="stats"></span>
  <div class="toolbar-right">
    <div class="view-toggle" id="viewToggle">
      <button class="view-btn active" data-view="grid" onclick="setView('grid')">卡片</button>
      <button class="view-btn" data-view="list" onclick="setView('list')">列表</button>
    </div>
    <button class="btn-print btn-print-badge" id="btnPrintBadge" onclick="openBadgePrint()" disabled>
      <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      打印徽章
    </button>
    <button class="btn-print btn-print-postcard" id="btnPrint" onclick="openPrintPreview()" disabled>
      <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      明信片打印
    </button>
  </div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabBadgeBtn" onclick="switchTab('badge')">
    徽章 <span class="tab-badge-indicator" id="badgeTabCount">0</span>
  </button>
  <button class="tab-btn" id="tabPostcardBtn" onclick="switchTab('postcard')">
    明信片 <span class="tab-badge-indicator" id="postcardTabCount">0</span>
  </button>
</div>

<!-- Badge Gallery -->
<div class="badge-gallery" id="badgeGallery">
  <div class="empty-state" id="badgeEmptyState">
    <div class="empty-icon">&#x1F3C5;</div>
    <h2>还没有加载徽章</h2>
    <p>
      点击上方「选择徽章文件夹」按钮<br>
      选择存放徽章图片的文件夹<br>
      支持 PNG / JPG / WEBP 格式<br>
      每张 A4 打印 6 枚 58mm 圆形徽章
    </p>
  </div>
</div>

<!-- Postcard Gallery -->
<div class="gallery hidden" id="gallery">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">&#x1F4EC;</div>
    <h2>还没有加载明信片</h2>
    <p>
      点击上方「选择明信片文件夹」按钮<br>
      选择存放明信片图片的文件夹<br>
      支持 PNG / JPG / WEBP 格式<br>
      按「描述-序号」命名，如：秋日湖畔-1
    </p>
  </div>
</div>

<!-- Badge Lightbox -->
<div class="badge-lightbox" id="badgeLightbox" onclick="closeBadgeLightbox()">
  <div class="badge-lb-inner" onclick="event.stopPropagation()">
    <div class="badge-lb-circle">
      <img id="blbImg" src="" alt="">
    </div>
    <div class="badge-lb-title" id="blbTitle"></div>
    <div class="badge-lb-meta" id="blbMeta"></div>
    <button class="lb-close" onclick="closeBadgeLightbox()" style="position:relative;top:auto;right:auto;">&times;</button>
  </div>
</div>

<!-- Postcard Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">&times;</button>
  <button class="lb-nav lb-prev" onclick="navLightbox(-1)">&#8249;</button>
  <button class="lb-nav lb-next" onclick="navLightbox(1)">&#8250;</button>
  <div class="lightbox-inner">
    <img class="lightbox-img" id="lbImg" src="" alt="">
    <div class="lightbox-detail">
      <div>
        <h3 id="lbTitle"></h3>
        <span class="lb-meta" id="lbMeta"></span>
      </div>
      <span class="postcard-num" id="lbNum" style="width:36px;height:36px;font-size:1rem;"></span>
    </div>
    <div class="lb-back-preview">
      <div class="lb-msg-area">
        <div class="lb-msg-title">寄语 · TO ___________</div>
        <div class="lb-msg-lines"></div>
      </div>
      <div class="lb-back-divider"></div>
      <div class="lb-addr-area">
        <div class="lb-stamp">邮票<br>STAMP</div>
        <div class="lb-to">TO · 寄给谁</div>
        <div class="lb-addr-lines"></div>
      </div>
    </div>
  </div>
</div>

<!-- Postcard Print Overlay -->
<div class="print-overlay" id="printOverlay">
  <div class="print-toolbar">
    <h3>明信片打印预览</h3>
    <div class="print-toolbar-btns">
      <button class="pt-btn pt-btn-close" onclick="closePrintPreview()">返回</button>
      <button class="pt-btn pt-btn-print" onclick="doPrint()">打印</button>
    </div>
  </div>
  <div class="print-pages" id="printPages"></div>
</div>

<!-- Badge Print Overlay -->
<div class="badge-print-overlay" id="badgePrintOverlay">
  <div class="print-toolbar">
    <h3>徽章打印预览（A4 · 每页 6 枚 58mm）</h3>
    <div class="print-toolbar-btns">
      <button class="pt-btn pt-btn-close" onclick="closeBadgePrintPreview()">返回</button>
      <button class="pt-btn pt-btn-print" style="background:var(--blue);" onclick="doBadgePrint()">打印</button>
    </div>
  </div>
  <div class="print-pages" id="badgePrintPages"></div>
</div>

<footer class="site-footer">AI文创作品展 · AI 文创课 · 学员作品集</footer>

<script>
let cards   = [];   // postcard images
let badges  = [];   // badge images
let currentLbIndex = -1;
let currentTab = 'badge';

/* ── Filename Parser ── */
function parseFilename(name) {
  const base = name.replace(/\.\w+$/, '');
  const match = base.match(/^(.+?)[-_](\d+)$/);
  if (match) return { description: match[1], number: parseInt(match[2], 10) };
  return { description: base, number: 0 };
}

/* ── Tab Switch ── */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabBadgeBtn').classList.toggle('active', tab === 'badge');
  document.getElementById('tabPostcardBtn').classList.toggle('active', tab === 'postcard');
  document.getElementById('badgeGallery').classList.toggle('hidden', tab !== 'badge');
  document.getElementById('gallery').classList.toggle('hidden', tab !== 'postcard');
  document.getElementById('viewToggle').style.display = tab === 'postcard' ? '' : 'none';
  updateStats();
}

function updateTabCounts() {
  document.getElementById('badgeTabCount').textContent = badges.length;
  document.getElementById('postcardTabCount').textContent = cards.length;
}

function updateStats() {
  const el = document.getElementById('stats');
  if (currentTab === 'badge') {
    el.innerHTML = badges.length > 0
      ? '共 <strong>' + badges.length + '</strong> 枚徽章'
      : '';
  } else {
    if (cards.length === 0) { el.textContent = ''; return; }
    const groups = new Set(cards.map(c => c.description));
    el.innerHTML = '共 <strong>' + cards.length + '</strong> 张作品 · <strong>' + groups.size + '</strong> 个系列';
  }
}

/* ── Scan Badge Folder ── */
async function scanBadgeFolder() {
  if (!('showDirectoryPicker' in window)) {
    alert('当前浏览器不支持文件夹选择，请使用 Chrome 或 Edge 浏览器。');
    return;
  }
  try {
    const dirHandle = await window.showDirectoryPicker();
    badges = [];
    const imageExts = ['.png', '.jpg', '.jpeg', '.webp', '.bmp', '.gif'];
    for await (const entry of dirHandle.values()) {
      if (entry.kind !== 'file') continue;
      const ext = entry.name.substring(entry.name.lastIndexOf('.')).toLowerCase();
      if (!imageExts.includes(ext)) continue;
      const file = await entry.getFile();
      const url  = URL.createObjectURL(file);
      const parsed = parseFilename(entry.name);
      badges.push({ filename: entry.name, url, description: parsed.description, number: parsed.number, size: file.size });
    }
    badges.sort((a, b) => {
      if (a.description !== b.description) return a.description.localeCompare(b.description, 'zh');
      return a.number - b.number;
    });
    renderBadgeGallery();
    document.getElementById('btnPrintBadge').disabled = badges.length === 0;
    switchTab('badge');
    updateTabCounts();
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

/* ── Scan Postcard Folder ── */
async function scanPostcardFolder() {
  if (!('showDirectoryPicker' in window)) {
    alert('当前浏览器不支持文件夹选择，请使用 Chrome 或 Edge 浏览器。');
    return;
  }
  try {
    const dirHandle = await window.showDirectoryPicker();
    cards = [];
    const imageExts = ['.png', '.jpg', '.jpeg', '.webp', '.bmp', '.gif'];
    for await (const entry of dirHandle.values()) {
      if (entry.kind !== 'file') continue;
      const ext = entry.name.substring(entry.name.lastIndexOf('.')).toLowerCase();
      if (!imageExts.includes(ext)) continue;
      const file = await entry.getFile();
      const url  = URL.createObjectURL(file);
      const parsed = parseFilename(entry.name);
      cards.push({ filename: entry.name, url, description: parsed.description, number: parsed.number, size: file.size });
    }
    cards.sort((a, b) => {
      if (a.description !== b.description) return a.description.localeCompare(b.description, 'zh');
      return a.number - b.number;
    });
    renderGallery();
    document.getElementById('btnPrint').disabled = cards.length === 0;
    switchTab('postcard');
    updateTabCounts();
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

/* ── Render Badge Gallery ── */
function renderBadgeGallery() {
  const gallery = document.getElementById('badgeGallery');
  const empty   = document.getElementById('badgeEmptyState');
  if (badges.length === 0) {
    gallery.innerHTML = '';
    gallery.appendChild(empty);
    empty.style.display = '';
    return;
  }
  gallery.innerHTML = badges.map((badge, i) => `
    <div class="badge-card" onclick="openBadgeLightbox(${i})">
      <div class="badge-circle">
        <img src="${badge.url}" alt="${badge.description}" loading="lazy">
        ${badge.number ? '<div class="badge-num-tag">' + badge.number + '</div>' : ''}
      </div>
      <div class="badge-name">${badge.description}</div>
    </div>
  `).join('');
  updateStats();
}

/* ── Render Postcard Gallery ── */
function renderGallery() {
  const gallery = document.getElementById('gallery');
  const empty   = document.getElementById('emptyState');
  if (cards.length === 0) {
    gallery.innerHTML = '';
    gallery.appendChild(empty);
    empty.style.display = '';
    updateStats();
    return;
  }
  gallery.innerHTML = cards.map((card, i) => `
    <div class="postcard" onclick="openLightbox(${i})">
      <div class="postcard-img-wrap">
        <img src="${card.url}" alt="${card.description}" loading="lazy">
        <div class="postcard-border"></div>
        <div class="stamp-deco">邮票<br>STAMP</div>
      </div>
      <div class="postcard-flag">
        <span class="fb1"></span><span class="fb2"></span><span class="fb3"></span><span class="fb4"></span><span class="fb5"></span>
      </div>
      <div class="postcard-info">
        <span class="postcard-title">${card.description}</span>
        <span class="postcard-num">${card.number || '#'}</span>
      </div>
    </div>
  `).join('');
  updateStats();
}

function setView(mode) {
  const gallery = document.getElementById('gallery');
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
  gallery.classList.toggle('list-view', mode === 'list');
}

/* ── Badge Lightbox ── */
function openBadgeLightbox(index) {
  const badge = badges[index];
  document.getElementById('blbImg').src   = badge.url;
  document.getElementById('blbTitle').textContent = badge.description + (badge.number ? ' · No.' + badge.number : '');
  document.getElementById('blbMeta').textContent  = badge.filename;
  document.getElementById('badgeLightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeBadgeLightbox() {
  document.getElementById('badgeLightbox').classList.remove('active');
  document.body.style.overflow = '';
}

/* ── Postcard Lightbox ── */
function openLightbox(index) {
  currentLbIndex = index;
  const card = cards[index];
  document.getElementById('lbImg').src   = card.url;
  document.getElementById('lbTitle').textContent = card.description;
  document.getElementById('lbMeta').textContent  = card.filename;
  document.getElementById('lbNum').textContent   = card.number || '#';
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
  currentLbIndex = -1;
}
function navLightbox(dir) {
  if (cards.length === 0) return;
  currentLbIndex = (currentLbIndex + dir + cards.length) % cards.length;
  const card = cards[currentLbIndex];
  document.getElementById('lbImg').src   = card.url;
  document.getElementById('lbTitle').textContent = card.description;
  document.getElementById('lbMeta').textContent  = card.filename;
  document.getElementById('lbNum').textContent   = card.number || '#';
}
document.addEventListener('keydown', e => {
  if (currentLbIndex >= 0) {
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowLeft')   navLightbox(-1);
    if (e.key === 'ArrowRight')  navLightbox(1);
  }
  if (document.getElementById('badgeLightbox').classList.contains('active')) {
    if (e.key === 'Escape') closeBadgeLightbox();
  }
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLightbox();
});

/* ── Page size helper (dynamic @page injection) ── */
function setPageSize(size) {
  let s = document.getElementById('dynamic-page-style');
  if (!s) { s = document.createElement('style'); s.id = 'dynamic-page-style'; document.head.appendChild(s); }
  s.textContent = `@page { size: ${size}; margin: 0; }`;
}

/* ── Badge Print (overlay, A4 2×3) ── */
function openBadgePrint() {
  if (badges.length === 0) return;

  const posClasses = ['bap1','bap2','bap3','bap4','bap5','bap6'];
  const groups = [];
  for (let i = 0; i < badges.length; i += 6) groups.push(badges.slice(i, i + 6));
  const totalPages = groups.length;

  const container = document.getElementById('badgePrintPages');
  container.innerHTML = groups.map((group, pi) => {
    const badgesHTML = group.map((badge, pos) => `
      <div class="badge-on-page ${posClasses[pos]}">
        <img src="${badge.url}" alt="${badge.description}">
      </div>
    `).join('');
    return `
      <div class="badge-print-pair">
        <span class="print-page-label">
          第 ${pi + 1} 页 · 徽章 ${pi * 6 + 1}–${Math.min(pi * 6 + 6, badges.length)}
        </span>
        <div class="badge-print-a4">
          <div class="badge-corner-info">
            <b>AI 文创作品展</b> ｜ 58mm 徽章 · A4 拼版 · 第 ${pi + 1} 张
          </div>
          ${badgesHTML}
          <div class="badge-page-no">A4-${String(pi + 1).padStart(2,'0')} / 共 ${totalPages} 张</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('badgePrintOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeBadgePrintPreview() {
  document.getElementById('badgePrintOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

function doBadgePrint() {
  setPageSize('A4 portrait');
  window.print();
}


/* ── Postcard Print ── */
function buildFrontHTML(card) {
  return `<div class="prt-front">
    <div class="prt-front-image"><img src="${card.url}" alt="${card.description}"></div>
    <div class="prt-front-strip">
      <span class="prt-title">${card.description}</span>
      <span class="prt-flag">
        <span class="fb1"></span><span class="fb2"></span><span class="fb3"></span><span class="fb4"></span><span class="fb5"></span>
      </span>
      <span>No.${card.number || '#'} / 2026</span>
    </div>
  </div>`;
}
function buildBackHTML(card) {
  return `<div class="prt-back">
    <div class="prt-msg-area">
      <div class="prt-msg-title">寄语 · TO ___________</div>
      <div class="prt-msg-lines"></div>
      <div class="prt-msg-foot">—— ${card.description} · No.${card.number || '#'}</div>
    </div>
    <div class="prt-back-divider"></div>
    <div class="prt-addr-area">
      <div class="prt-stamp">邮票<br>STAMP</div>
      <div class="prt-to-label">TO · 寄给谁</div>
      <div class="prt-addr-lines"></div>
      <div class="prt-postcode">
        <div class="prt-box"></div><div class="prt-box"></div><div class="prt-box"></div>
        <div class="prt-box"></div><div class="prt-box"></div><div class="prt-box"></div>
      </div>
      <div class="prt-course-foot">AI 文创课 · 明信片作品 · 2026</div>
    </div>
  </div>`;
}
function openPrintPreview() {
  if (cards.length === 0) return;
  const container = document.getElementById('printPages');
  container.innerHTML = cards.map((card, i) => `
    <div class="print-pair">
      <span class="print-page-label">第 ${i + 1} 张 ·「${card.description}」· 正面</span>
      <div class="print-page">${buildFrontHTML(card)}</div>
      <span class="print-page-label">第 ${i + 1} 张 ·「${card.description}」· 背面</span>
      <div class="print-page">${buildBackHTML(card)}</div>
    </div>
  `).join('');
  document.getElementById('printOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closePrintPreview() {
  document.getElementById('printOverlay').classList.remove('active');
  document.body.style.overflow = '';
}
function doPrint() {
  setPageSize('148mm 105mm');
  window.print();
}

/* ── Init ── */
switchTab('badge');
updateTabCounts();
</script>
</body>
</html>
