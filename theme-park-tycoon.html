<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>春熙路太古里 Theme Park Tycoon</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #17202a;
    --panel: rgba(246, 248, 244, 0.88);
    --line: rgba(23, 32, 42, 0.16);
    --green: #2f8f5b;
    --red: #c53d36;
    --gold: #d4972f;
    --blue: #2774a8;
    --night: #1f2942;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: var(--ink);
    background: #94c7c9;
  }

  #app {
    position: fixed;
    inset: 0;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hud {
    position: fixed;
    inset: 14px;
    pointer-events: none;
    display: grid;
    grid-template-columns: minmax(210px, 300px) 1fr minmax(220px, 330px);
    grid-template-rows: auto 1fr auto;
    gap: 12px;
  }

  .panel {
    pointer-events: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 16px 42px rgba(14, 22, 28, 0.18);
    backdrop-filter: blur(12px);
  }

  .brand {
    grid-column: 1;
    grid-row: 1;
    padding: 14px 16px;
  }

  .brand h1 {
    margin: 0;
    font-size: 18px;
    line-height: 1.2;
    letter-spacing: 0;
  }

  .brand p {
    margin: 7px 0 0;
    color: #46525d;
    font-size: 12px;
    line-height: 1.4;
  }

  .stats {
    grid-column: 2;
    grid-row: 1;
    align-self: start;
    display: grid;
    grid-template-columns: repeat(5, minmax(90px, 1fr));
    gap: 1px;
    overflow: hidden;
  }

  .stat {
    min-width: 0;
    padding: 12px;
    background: rgba(255,255,255,0.38);
  }

  .stat span {
    display: block;
    font-size: 11px;
    color: #53606a;
  }

  .stat strong {
    display: block;
    margin-top: 5px;
    font-size: 18px;
    white-space: nowrap;
  }

  .controls {
    grid-column: 3;
    grid-row: 1 / span 2;
    align-self: start;
    padding: 12px;
  }

  .section {
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: 12px;
  }

  .section:first-child {
    border-top: 0;
    padding-top: 0;
    margin-top: 0;
  }

  .section h2 {
    margin: 0 0 9px;
    font-size: 12px;
    letter-spacing: 0;
    color: #3b4650;
  }

  .button-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  button {
    min-height: 36px;
    border: 1px solid rgba(23,32,42,0.16);
    border-radius: 7px;
    background: #ffffff;
    color: #1f2b35;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }

  button:hover {
    transform: translateY(-1px);
    border-color: rgba(23,32,42,0.34);
  }

  button.active {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }

  button.primary {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }

  .slider-row {
    display: grid;
    grid-template-columns: 72px 1fr 34px;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    margin: 9px 0;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--blue);
  }

  .legend {
    grid-column: 1;
    grid-row: 3;
    align-self: end;
    padding: 12px 14px;
    font-size: 12px;
    line-height: 1.6;
    color: #31404a;
  }

  .log {
    grid-column: 3;
    grid-row: 3;
    align-self: end;
    max-height: 160px;
    overflow: hidden;
    padding: 12px;
  }

  .log h2 {
    margin: 0 0 8px;
    font-size: 12px;
  }

  .log p {
    margin: 6px 0;
    font-size: 12px;
    color: #33414c;
    line-height: 1.35;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 24px;
    padding: 0 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.58);
    border: 1px solid var(--line);
    font-size: 11px;
    color: #31404a;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
  }

  .dot.gold { background: var(--gold); }
  .dot.red { background: var(--red); }
  .dot.blue { background: var(--blue); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    background: rgba(23, 32, 42, 0.86);
    color: white;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .2s ease;
  }

  .toast.show { opacity: 1; }

  @media (max-width: 900px) {
    .hud {
      inset: 8px;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr auto;
    }

    .brand, .stats, .controls, .legend, .log {
      grid-column: 1;
    }

    .stats {
      grid-row: 2;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .controls {
      grid-row: 4;
      max-height: 42vh;
      overflow: auto;
    }

    .legend, .log {
      display: none;
    }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <section class="panel brand">
    <h1>春熙路太古里 Theme Park Tycoon</h1>
    <p>低多边形成都城市主题公园模拟：游客、设施、营收、昼夜、天气与动态交通。</p>
  </section>

  <section class="panel stats" aria-label="经营数据">
    <div class="stat"><span>现金</span><strong id="cash">¥0</strong></div>
    <div class="stat"><span>游客</span><strong id="guests">0</strong></div>
    <div class="stat"><span>满意度</span><strong id="happy">0%</strong></div>
    <div class="stat"><span>日收入</span><strong id="income">¥0</strong></div>
    <div class="stat"><span>园区时间</span><strong id="clock">08:00</strong></div>
  </section>

  <section class="panel controls">
    <div class="section">
      <h2>视角</h2>
      <div class="button-grid" id="viewButtons">
        <button data-view="orbit" class="active">自由视角</button>
        <button data-view="top">经营俯视</button>
        <button data-view="street">春熙路街景</button>
        <button data-view="ride">过山车跟随</button>
        <button data-view="cinematic">巡游镜头</button>
        <button data-view="temple">大慈寺静景</button>
      </div>
    </div>

    <div class="section">
      <h2>模拟</h2>
      <div class="slider-row">
        <span>速度</span>
        <input id="speed" type="range" min="0" max="4" step="1" value="2">
        <strong id="speedLabel">2x</strong>
      </div>
      <div class="slider-row">
        <span>客流</span>
        <input id="flow" type="range" min="20" max="220" step="10" value="120">
        <strong id="flowLabel">120</strong>
      </div>
      <div class="button-grid">
        <button id="pause">暂停</button>
        <button id="weather">切换天气</button>
      </div>
    </div>

    <div class="section">
      <h2>建造</h2>
      <div class="button-grid">
        <button class="primary" data-build="tea">盖熊猫茶馆</button>
        <button class="primary" data-build="show">开街头演出</button>
        <button class="primary" data-build="garden">扩建竹林花园</button>
        <button class="primary" data-build="shop">升级潮牌店</button>
      </div>
    </div>

    <div class="section">
      <h2>园区状态</h2>
      <div class="chip-row">
        <span class="chip"><span class="dot"></span>设施运行</span>
        <span class="chip"><span class="dot gold"></span>排队动态</span>
        <span class="chip"><span class="dot blue"></span>轨交循环</span>
        <span class="chip"><span class="dot red"></span>事件触发</span>
      </div>
    </div>
  </section>

  <section class="panel legend">
    鼠标左键旋转，滚轮缩放，右键平移。场景主体包含太古里低层街区、IFS 熊猫墙、春熙路灯牌、大慈寺、地铁口、商业街、游乐设施和巡游人流。
  </section>

  <section class="panel log">
    <h2>运营日志</h2>
    <div id="logItems"></div>
  </section>
</div>
<div id="toast" class="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c5c7);
scene.fog = new THREE.Fog(0x91c5c7, 90, 360);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 900);
camera.position.set(85, 70, 92);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 24;
controls.maxDistance = 220;
controls.target.set(0, 0, 0);

const hemi = new THREE.HemisphereLight(0xe9f6ff, 0x7b6c54, 2.1);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0c4, 2.6);
sun.position.set(80, 120, 50);
sun.castShadow = true;
sun.shadow.camera.left = -130;
sun.shadow.camera.right = 130;
sun.shadow.camera.top = 130;
sun.shadow.camera.bottom = -130;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const nightLights = [];
const animated = [];
const guests = [];
const vehicles = [];
const queueMarkers = [];
const buildSlots = [];
const tmp = new THREE.Vector3();

const sim = {
  cash: 128000,
  guests: 120,
  happiness: 82,
  income: 0,
  time: 8.2,
  speed: 2,
  paused: false,
  flow: 120,
  weather: 0,
  activeView: 'orbit',
  built: { tea: 0, show: 0, garden: 0, shop: 0 },
  nextEvent: 0,
  rideCameraT: 0,
  cinematicT: 0
};

const colors = {
  grass: 0x62a965,
  pavement: 0xd5d0c3,
  road: 0x46545a,
  lane: 0xf2d36b,
  brick: 0xb96550,
  shop: 0xf3f0df,
  glass: 0x7fc0d6,
  roof: 0x4d6c77,
  pandaWhite: 0xf4f1e7,
  pandaBlack: 0x1f2426,
  templeRed: 0xad3e35,
  templeRoof: 0x2e5e56,
  bamboo: 0x2d7d4b,
  water: 0x4395a3
};

const matCache = new Map();
function mat(color, rough = 0.82, metal = 0.03) {
  const key = `${color}-${rough}-${metal}`;
  if (!matCache.has(key)) {
    matCache.set(key, new THREE.MeshStandardMaterial({
      color,
      roughness: rough,
      metalness: metal,
      flatShading: true
    }));
  }
  return matCache.get(key);
}

function mesh(geometry, material, x = 0, y = 0, z = 0, cast = true, receive = true) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = receive;
  scene.add(m);
  return m;
}

function groupAt(x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  scene.add(g);
  return g;
}

function box(w, h, d, color, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cyl(r1, r2, h, color, x, y, z, sides = 8, parent = scene) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, sides), mat(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cone(r, h, color, x, y, z, sides = 6, parent = scene) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, sides), mat(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  parent.add(m);
  return m;
}

function addLabel(text, x, y, z, color = '#17202a', scale = 1) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(255,255,255,0.84)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = color;
  ctx.font = 'bold 44px Microsoft YaHei, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sprite.position.set(x, y, z);
  sprite.scale.set(14 * scale, 3.5 * scale, 1);
  scene.add(sprite);
  return sprite;
}

function addGround() {
  mesh(new THREE.PlaneGeometry(260, 220, 8, 8), mat(colors.grass), 0, -0.02, 0, false, true).rotation.x = -Math.PI / 2;

  const mainRoad = mesh(new THREE.BoxGeometry(230, 0.12, 18), mat(colors.road), 0, 0, -33, false, true);
  const crossRoad = mesh(new THREE.BoxGeometry(18, 0.13, 190), mat(colors.road), -52, 0.01, 0, false, true);
  const plaza = mesh(new THREE.BoxGeometry(84, 0.14, 58), mat(colors.pavement), 8, 0.03, 8, false, true);
  plaza.rotation.y = 0.02;

  for (let i = -9; i <= 9; i++) {
    box(5, 0.04, 0.5, colors.lane, i * 12, 0.09, -33);
  }

  const water = mesh(new THREE.CircleGeometry(18, 9), mat(colors.water, 0.55), 45, 0.08, 50, false, true);
  water.rotation.x = -Math.PI / 2;
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    cone(1.2, 5 + Math.random() * 2, colors.bamboo, 45 + Math.cos(a) * 21, 0, 50 + Math.sin(a) * 16, 5);
  }
}

function addLowPolyTree(x, z, s = 1) {
  const g = groupAt(x, 0, z);
  cyl(0.35 * s, 0.45 * s, 2.4 * s, 0x7c5a39, 0, 0, 0, 6, g);
  cone(2.3 * s, 5.5 * s, 0x2f8f5b, 0, 2.1 * s, 0, 7, g);
  cone(1.7 * s, 4.1 * s, 0x3aa96c, 0, 4.5 * s, 0, 7, g);
  return g;
}

function addUrbanForest() {
  for (let i = 0; i < 74; i++) {
    const ring = i % 4;
    const x = (Math.random() - 0.5) * 230;
    const z = (Math.random() - 0.5) * 190;
    if (Math.abs(x - 8) < 52 && Math.abs(z - 8) < 42) continue;
    if (Math.abs(z + 33) < 13 || Math.abs(x + 52) < 13) continue;
    addLowPolyTree(x, z, 0.55 + ring * 0.13);
  }
}

function addTaikooLiBlocks() {
  const blocks = [
    [-18, 4, 10, 18, 6, 14, 0xf0ead5],
    [8, 4, 18, 20, 7, 12, 0xe2dfcf],
    [34, 4, 8, 18, 5, 18, 0xf4ead8],
    [-24, 4, 38, 20, 6, 14, 0xdedbc8],
    [3, 4, 44, 22, 5, 14, 0xf6f0dd],
    [31, 4, 38, 18, 7, 13, 0xe8e2cf],
    [-26, 4, -10, 18, 5, 12, 0xf3ecd9],
    [2, 4, -7, 19, 6, 12, 0xe9e5d3],
    [28, 4, -12, 18, 5, 13, 0xf2e8d3]
  ];

  blocks.forEach((b, i) => {
    const [x, y, z, w, h, d, c] = b;
    const g = groupAt(x, 0, z);
    box(w, h, d, c, 0, 0, 0, g);
    const roof = box(w + 1.2, 0.7, d + 1.2, colors.roof, 0, h, 0, g);
    roof.rotation.y = (i % 2 ? 0.06 : -0.05);
    for (let k = -1; k <= 1; k++) {
      box(2.5, 2.1, 0.12, colors.glass, k * w / 4, 2.1, -d / 2 - 0.07, g);
      box(2.5, 2.1, 0.12, colors.glass, k * w / 4, 2.1, d / 2 + 0.07, g);
    }
    if (i % 2 === 0) {
      addLabel(['潮牌', '咖啡', '书店', '火锅'][i % 4], x, h + 2.2, z - d / 2 - 1.2, '#30424c', 0.5);
    }
  });

  addLabel('太古里', 4, 15, 3, '#22313a', 1.2);
}

function addIFSAndPanda() {
  const tower = groupAt(-72, 0, 13);
  box(20, 42, 18, 0x879eaa, 0, 0, 0, tower);
  for (let y = 6; y < 39; y += 6) {
    box(20.4, 0.22, 18.4, 0xe9f1f2, 0, y, 0, tower);
  }
  box(23, 8, 20, 0xd7d0c2, 0, 0, 0, tower);
  addLabel('IFS', -72, 47, 3, '#1e2a32', 0.8);

  const panda = groupAt(-59, 23, 4);
  const body = new THREE.Mesh(new THREE.SphereGeometry(4.2, 8, 6), mat(colors.pandaWhite));
  body.scale.set(1, 1.15, 0.8);
  body.castShadow = true;
  panda.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(2.8, 8, 6), mat(colors.pandaWhite));
  head.position.set(0, 5.2, 0);
  head.castShadow = true;
  panda.add(head);
  [[-1.8, 7.2, 0], [1.8, 7.2, 0], [-1.1, 5.6, -2.2], [1.1, 5.6, -2.2], [-3.2, 1, 0], [3.2, 1, 0]].forEach(([x,y,z], i) => {
    const part = new THREE.Mesh(new THREE.SphereGeometry(i < 2 ? 1 : 0.8, 7, 5), mat(colors.pandaBlack));
    part.position.set(x, y, z);
    part.castShadow = true;
    panda.add(part);
  });
}

function addTemple() {
  const temple = groupAt(72, 0, 16);
  box(28, 8, 18, 0xe2c28d, 0, 0, 0, temple);
  box(30, 2, 20, colors.templeRoof, 0, 8, 0, temple).rotation.y = 0.04;
  box(24, 2, 15, 0x2c514d, 0, 10, 0, temple).rotation.y = -0.04;
  for (let x of [-10, -3.3, 3.3, 10]) cyl(0.55, 0.65, 8, colors.templeRed, x, 0, -8.5, 8, temple);
  addLabel('大慈寺', 72, 15, 4, '#873c32', 0.72);
}

function addChunxiStreet() {
  const gate = groupAt(-8, 0, -47);
  box(3, 18, 3, 0xc53d36, -14, 0, 0, gate);
  box(3, 18, 3, 0xc53d36, 14, 0, 0, gate);
  box(34, 4, 3, 0xd4972f, 0, 16, 0, gate);
  addLabel('春熙路', -8, 22, -48.7, '#a62524', 0.85);

  for (let i = 0; i < 8; i++) {
    const x = -90 + i * 22;
    const h = 10 + (i % 3) * 4;
    const g = groupAt(x, 0, -58);
    box(12, h, 9, i % 2 ? 0xdad3c3 : 0xbac7c9, 0, 0, 0, g);
    const sign = box(9, 3, 0.4, [0xc53d36, 0x2774a8, 0xd4972f, 0x2f8f5b][i % 4], 0, h - 1.5, -4.7, g);
    nightLights.push(sign);
  }

  const metro = groupAt(-50, 0, -18);
  box(10, 2.4, 8, 0xebe6d7, 0, 0, 0, metro);
  box(8, 4, 1, 0x2774a8, 0, 2.2, -4.2, metro);
  addLabel('地铁', -50, 7, -21.5, '#1f5e84', 0.45);
}

function addFerrisWheel() {
  const g = groupAt(68, 0, -56);
  const wheel = new THREE.Group();
  wheel.position.y = 20;
  g.add(wheel);

  const torus = new THREE.Mesh(new THREE.TorusGeometry(16, 0.55, 6, 28), mat(0xd7eff0));
  torus.castShadow = true;
  wheel.add(torus);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.35, 16, 0.35), mat(0xffffff));
    spoke.position.set(Math.cos(a) * 4, Math.sin(a) * 4, 0);
    spoke.rotation.z = -a;
    wheel.add(spoke);
    const car = box(3.1, 2.1, 2.2, [0xc53d36, 0xd4972f, 0x2f8f5b, 0x2774a8][i % 4], Math.cos(a) * 16, Math.sin(a) * 16 - 1, 0, wheel);
    car.userData.keepUpright = true;
  }
  cyl(0.8, 0.8, 39, 0xffffff, -9, 0, 0, 8, g).rotation.z = -0.45;
  cyl(0.8, 0.8, 39, 0xffffff, 9, 0, 0, 8, g).rotation.z = 0.45;
  cyl(1.4, 1.4, 4, 0xd4972f, 0, 18, 0, 10, g).rotation.x = Math.PI / 2;
  addLabel('天府之眼', 68, 42, -56, '#255b77', 0.68);
  animated.push({ type: 'wheel', object: wheel, speed: 0.22 });
}

function addCarousel() {
  const g = groupAt(-4, 0, 67);
  cyl(9, 10, 2, 0xd4972f, 0, 0, 0, 12, g);
  cone(12, 7, 0xc53d36, 0, 7, 0, 12, g);
  const ride = new THREE.Group();
  ride.position.y = 2;
  g.add(ride);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * Math.PI * 2;
    const horse = box(2.2, 1.2, 1.1, i % 2 ? 0xf4f1e7 : 0x8ec9d2, Math.cos(a) * 6, 1, Math.sin(a) * 6, ride);
    horse.rotation.y = -a;
    cyl(0.08, 0.08, 5, 0xffffff, Math.cos(a) * 6, 0, Math.sin(a) * 6, 6, ride);
  }
  addLabel('锦城旋转木马', -4, 16, 67, '#873c32', 0.62);
  animated.push({ type: 'spin', object: ride, speed: 0.75 });
}

function makeTrackPoint(t) {
  const a = t * Math.PI * 2;
  const x = -58 + Math.cos(a) * 28 + Math.sin(a * 2) * 7;
  const z = 60 + Math.sin(a) * 17;
  const y = 7 + Math.sin(a * 3) * 5 + Math.max(0, Math.cos(a - 0.9)) * 9;
  return new THREE.Vector3(x, y, z);
}

function addRollerCoaster() {
  const curve = new THREE.CatmullRomCurve3(Array.from({ length: 72 }, (_, i) => makeTrackPoint(i / 72)), true, 'catmullrom', 0.5);
  const rail = new THREE.Mesh(new THREE.TubeGeometry(curve, 180, 0.32, 6, true), mat(0xc53d36));
  rail.castShadow = true;
  scene.add(rail);

  for (let i = 0; i < 18; i++) {
    const p = curve.getPoint(i / 18);
    cyl(0.28, 0.34, p.y, 0x596770, p.x, 0, p.z, 6);
  }

  const train = new THREE.Group();
  scene.add(train);
  for (let i = 0; i < 4; i++) {
    box(2.8, 1.5, 2, [0xd4972f, 0x2774a8, 0x2f8f5b, 0xc53d36][i], -i * 2.7, 0, 0, train);
  }
  addLabel('熊猫云霄飞车', -58, 30, 60, '#a62524', 0.62);
  animated.push({ type: 'coaster', object: train, curve, t: 0, speed: 0.055 });
  return { train, curve };
}

function addDropTower() {
  const g = groupAt(98, 0, 52);
  cyl(1.1, 1.4, 34, 0x596770, 0, 0, 0, 8, g);
  const car = box(7, 3, 7, 0x2774a8, 0, 12, 0, g);
  cone(7, 8, 0xd4972f, 0, 34, 0, 8, g);
  addLabel('太古跳楼机', 98, 46, 52, '#1f5e84', 0.58);
  animated.push({ type: 'drop', object: car, base: 5, top: 26, t: 0, speed: 0.6 });
}

function addMonorail() {
  const curve = new THREE.EllipseCurve(0, 0, 91, 72, 0, Math.PI * 2, false, 0.2);
  const points = curve.getPoints(96).map(p => new THREE.Vector3(p.x, 13, p.y - 4));
  const path = new THREE.CatmullRomCurve3(points, true);
  const rail = new THREE.Mesh(new THREE.TubeGeometry(path, 180, 0.25, 5, true), mat(0x304b59));
  scene.add(rail);
  for (let i = 0; i < 24; i++) {
    const p = path.getPoint(i / 24);
    cyl(0.25, 0.3, 13, 0x4c5c62, p.x, 0, p.z, 5);
  }
  const train = new THREE.Group();
  scene.add(train);
  for (let i = 0; i < 3; i++) box(5.2, 2.3, 2.6, 0xe9f1f2, -i * 5.6, 0, 0, train);
  animated.push({ type: 'monorail', object: train, curve: path, t: 0, speed: 0.026 });
}

function addParade() {
  const path = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-90, 0.5, -33),
    new THREE.Vector3(-32, 0.5, -33),
    new THREE.Vector3(5, 0.5, -18),
    new THREE.Vector3(46, 0.5, -25),
    new THREE.Vector3(93, 0.5, -33)
  ]);
  for (let i = 0; i < 4; i++) {
    const float = new THREE.Group();
    scene.add(float);
    box(6, 1.2, 4, [0xd4972f, 0xc53d36, 0x2774a8, 0x2f8f5b][i], 0, 0, 0, float);
    cone(2.4, 4, [0x2f8f5b, 0xf4f1e7, 0xd4972f, 0xc53d36][i], 0, 1, 0, 6, float);
    vehicles.push({ object: float, path, t: i * -0.12, speed: 0.018 });
  }
}

function addGuests() {
  const paths = [
    new THREE.Vector3(-84, 0, -38), new THREE.Vector3(-42, 0, -30),
    new THREE.Vector3(-20, 0, 4), new THREE.Vector3(8, 0, 13),
    new THREE.Vector3(42, 0, 6), new THREE.Vector3(66, 0, -36),
    new THREE.Vector3(30, 0, 45), new THREE.Vector3(-4, 0, 62),
    new THREE.Vector3(-58, 0, 61), new THREE.Vector3(-26, 0, 32)
  ];
  for (let i = 0; i < 220; i++) {
    const g = new THREE.Group();
    scene.add(g);
    cyl(0.28, 0.28, 1.2, [0x2f8f5b, 0xd4972f, 0xc53d36, 0x2774a8, 0x7b5f91][i % 5], 0, 0, 0, 6, g);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 4), mat(0xf0c39b));
    head.position.y = 1.45;
    head.castShadow = true;
    g.add(head);
    const start = paths[Math.floor(Math.random() * paths.length)].clone();
    g.position.copy(start);
    guests.push({
      object: g,
      path: paths,
      index: Math.floor(Math.random() * paths.length),
      progress: Math.random(),
      speed: 0.6 + Math.random() * 0.9,
      offset: new THREE.Vector3((Math.random() - 0.5) * 3, 0, (Math.random() - 0.5) * 3)
    });
  }
}

function addQueuesAndSlots() {
  const rideSpots = [
    [68, -56, 12], [-4, 67, 9], [-58, 60, 12], [98, 52, 8], [72, 16, 7], [-72, 13, 8]
  ];
  rideSpots.forEach(([x, z, n], spotIndex) => {
    for (let i = 0; i < n; i++) {
      const q = cyl(0.18, 0.18, 1, [0x2f8f5b, 0xd4972f, 0x2774a8][i % 3], x - 5 + (i % 6) * 1.2, 0, z + 8 + Math.floor(i / 6) * 1.2, 6);
      q.scale.setScalar(spotIndex === 0 ? 1.1 : 1);
      queueMarkers.push({ object: q, base: q.position.clone(), phase: i * 0.7 });
    }
  });

  [[-40, -4], [17, 26], [54, 31], [-75, -18], [12, -48], [39, 68]].forEach(([x, z], i) => {
    const slot = mesh(new THREE.BoxGeometry(7, 0.16, 7), mat(0xe5d18a), x, 0.12, z, false, true);
    slot.rotation.y = Math.PI / 4;
    buildSlots.push(slot);
    addLabel('预留', x, 2.8, z, '#6e5420', 0.36);
  });
}

function addParticles() {
  const geometry = new THREE.BufferGeometry();
  const count = 900;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 260;
    positions[i * 3 + 1] = Math.random() * 70 + 12;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 210;
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const material = new THREE.PointsMaterial({ size: 0.24, color: 0xffffff, transparent: true, opacity: 0 });
  const points = new THREE.Points(geometry, material);
  scene.add(points);
  animated.push({ type: 'weather', object: points, positions });
}

addGround();
addUrbanForest();
addTaikooLiBlocks();
addIFSAndPanda();
addTemple();
addChunxiStreet();
addFerrisWheel();
addCarousel();
const coaster = addRollerCoaster();
addDropTower();
addMonorail();
addParade();
addGuests();
addQueuesAndSlots();
addParticles();

function addBuild(type) {
  const cost = { tea: 12000, show: 8000, garden: 6500, shop: 15000 }[type];
  if (sim.cash < cost) return toast('现金不足，先让园区多运营一会儿');
  sim.cash -= cost;
  sim.built[type] += 1;
  const slot = buildSlots[(sim.built.tea + sim.built.show + sim.built.garden + sim.built.shop - 1) % buildSlots.length];
  const x = slot.position.x;
  const z = slot.position.z;
  if (type === 'tea') {
    box(9, 5, 8, 0xf0ead5, x, 0, z);
    cone(6, 3, 0x2e5e56, x, 5, z, 6);
    addLabel('熊猫茶馆', x, 10, z, '#2d604e', 0.42);
  } else if (type === 'show') {
    box(10, 0.8, 6, 0xc53d36, x, 0, z);
    for (let i = 0; i < 4; i++) cyl(0.22, 0.22, 4, 0xd4972f, x - 4 + i * 2.6, 0.8, z - 2.5, 6);
    addLabel('街头演出', x, 6.5, z, '#a62524', 0.42);
  } else if (type === 'garden') {
    for (let i = 0; i < 9; i++) addLowPolyTree(x + (Math.random() - 0.5) * 10, z + (Math.random() - 0.5) * 10, 0.45);
    addLabel('竹林花园', x, 5.5, z, '#2d604e', 0.42);
  } else {
    box(11, 6, 8, 0xe8e2cf, x, 0, z);
    box(8, 2, 0.4, 0x2774a8, x, 4, z - 4.2);
    addLabel('潮牌旗舰', x, 10, z, '#1f5e84', 0.42);
  }
  sim.happiness = Math.min(99, sim.happiness + 2);
  log(`新项目落成：${{ tea: '熊猫茶馆', show: '街头演出', garden: '竹林花园', shop: '潮牌旗舰店' }[type]}`);
}

const ui = {
  cash: document.getElementById('cash'),
  guests: document.getElementById('guests'),
  happy: document.getElementById('happy'),
  income: document.getElementById('income'),
  clock: document.getElementById('clock'),
  speed: document.getElementById('speed'),
  speedLabel: document.getElementById('speedLabel'),
  flow: document.getElementById('flow'),
  flowLabel: document.getElementById('flowLabel'),
  pause: document.getElementById('pause'),
  weather: document.getElementById('weather'),
  log: document.getElementById('logItems'),
  toast: document.getElementById('toast')
};

function money(v) {
  return `¥${Math.round(v).toLocaleString('zh-CN')}`;
}

function log(text) {
  const p = document.createElement('p');
  p.textContent = text;
  ui.log.prepend(p);
  while (ui.log.children.length > 6) ui.log.lastChild.remove();
}

function toast(text) {
  ui.toast.textContent = text;
  ui.toast.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => ui.toast.classList.remove('show'), 1600);
}

function setView(view) {
  sim.activeView = view;
  document.querySelectorAll('#viewButtons button').forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
  controls.enabled = view === 'orbit';
  const views = {
    orbit: { pos: [85, 70, 92], target: [0, 0, 0] },
    top: { pos: [0, 175, 0.1], target: [0, 0, 0] },
    street: { pos: [-78, 12, -58], target: [4, 7, -30] },
    temple: { pos: [97, 20, 42], target: [70, 8, 12] }
  };
  if (views[view]) {
    camera.position.fromArray(views[view].pos);
    controls.target.fromArray(views[view].target);
  }
  toast(`已切换：${document.querySelector(`[data-view="${view}"]`).textContent}`);
}

document.getElementById('viewButtons').addEventListener('click', e => {
  if (e.target.matches('button[data-view]')) setView(e.target.dataset.view);
});

document.querySelectorAll('[data-build]').forEach(btn => {
  btn.addEventListener('click', () => addBuild(btn.dataset.build));
});

ui.speed.addEventListener('input', () => {
  sim.speed = Number(ui.speed.value);
  ui.speedLabel.textContent = sim.speed === 0 ? '停' : `${sim.speed}x`;
});

ui.flow.addEventListener('input', () => {
  sim.flow = Number(ui.flow.value);
  ui.flowLabel.textContent = sim.flow;
});

ui.pause.addEventListener('click', () => {
  sim.paused = !sim.paused;
  ui.pause.textContent = sim.paused ? '继续' : '暂停';
  ui.pause.classList.toggle('active', sim.paused);
});

ui.weather.addEventListener('click', () => {
  sim.weather = (sim.weather + 1) % 3;
  log(['晴天客流稳定', '夜雨模式开启，灯光更明显', '节庆烟花准备中'][sim.weather]);
});

function updateHud() {
  ui.cash.textContent = money(sim.cash);
  ui.guests.textContent = Math.round(sim.guests);
  ui.happy.textContent = `${Math.round(sim.happiness)}%`;
  ui.income.textContent = money(sim.income);
  const h = Math.floor(sim.time) % 24;
  const m = Math.floor((sim.time - Math.floor(sim.time)) * 60);
  ui.clock.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function updateLighting() {
  const day = (Math.sin((sim.time - 6) / 24 * Math.PI * 2) + 1) / 2;
  const night = 1 - day;
  sun.intensity = 0.45 + day * 2.6;
  hemi.intensity = 0.7 + day * 1.45;
  sun.position.set(Math.cos(sim.time / 24 * Math.PI * 2) * 120, 32 + day * 110, Math.sin(sim.time / 24 * Math.PI * 2) * 80);
  scene.background.lerpColors(new THREE.Color(0x1f2942), new THREE.Color(sim.weather === 1 ? 0x6f8790 : 0x91c5c7), day);
  scene.fog.color.copy(scene.background);
  nightLights.forEach((obj, i) => {
    obj.material.emissive = new THREE.Color(obj.material.color);
    obj.material.emissiveIntensity = night * (0.8 + Math.sin(performance.now() * 0.004 + i) * 0.25);
  });
}

function updateAnimated(dt) {
  animated.forEach(item => {
    if (item.type === 'wheel') {
      item.object.rotation.z += dt * item.speed;
      item.object.children.forEach(child => {
        if (child.userData.keepUpright) child.rotation.z = -item.object.rotation.z;
      });
    } else if (item.type === 'spin') {
      item.object.rotation.y += dt * item.speed;
    } else if (item.type === 'coaster') {
      item.t = (item.t + dt * item.speed) % 1;
      const p = item.curve.getPointAt(item.t);
      const ahead = item.curve.getPointAt((item.t + 0.01) % 1);
      item.object.position.copy(p);
      item.object.lookAt(ahead);
      item.object.position.y += 0.2;
    } else if (item.type === 'drop') {
      item.t += dt * item.speed;
      const phase = (Math.sin(item.t) + 1) / 2;
      const drop = Math.pow(phase, 5);
      item.object.position.y = item.base + (item.top - item.base) * (1 - drop);
    } else if (item.type === 'monorail') {
      item.t = (item.t + dt * item.speed) % 1;
      const p = item.curve.getPointAt(item.t);
      const ahead = item.curve.getPointAt((item.t + 0.008) % 1);
      item.object.position.copy(p);
      item.object.lookAt(ahead);
    } else if (item.type === 'weather') {
      item.object.material.opacity = sim.weather === 1 ? 0.48 : sim.weather === 2 ? 0.18 : 0;
      const arr = item.positions;
      for (let i = 0; i < arr.length / 3; i++) {
        arr[i * 3 + 1] -= dt * (sim.weather === 1 ? 16 : 4);
        arr[i * 3] += dt * 2.4;
        if (arr[i * 3 + 1] < 2) arr[i * 3 + 1] = 82;
      }
      item.object.geometry.attributes.position.needsUpdate = true;
    }
  });

  vehicles.forEach(v => {
    v.t = (v.t + dt * v.speed) % 1;
    const t = (v.t + 1) % 1;
    const p = v.path.getPointAt(t);
    const ahead = v.path.getPointAt((t + 0.02) % 1);
    v.object.position.copy(p);
    v.object.lookAt(ahead);
  });

  queueMarkers.forEach(q => {
    q.object.position.y = q.base.y + Math.sin(performance.now() * 0.004 + q.phase) * 0.12;
  });
}

function updateGuests(dt) {
  const visibleTarget = Math.min(guests.length, Math.round(sim.flow));
  guests.forEach((g, i) => {
    g.object.visible = i < visibleTarget;
    if (!g.object.visible) return;
    const from = g.path[g.index];
    const to = g.path[(g.index + 1) % g.path.length];
    g.progress += dt * g.speed * 0.05;
    if (g.progress >= 1) {
      g.progress = 0;
      g.index = (g.index + 1 + Math.floor(Math.random() * 3)) % g.path.length;
      g.offset.set((Math.random() - 0.5) * 3, 0, (Math.random() - 0.5) * 3);
    }
    g.object.position.lerpVectors(from, to, g.progress).add(g.offset);
    tmp.subVectors(to, from);
    g.object.rotation.y = Math.atan2(tmp.x, tmp.z);
  });
}

function updateEconomy(dt) {
  const targetGuests = sim.flow + sim.built.tea * 8 + sim.built.garden * 7 + sim.built.show * 10 + sim.built.shop * 6;
  sim.guests += (targetGuests - sim.guests) * dt * 0.12;
  const nightPenalty = sim.time < 7 || sim.time > 22 ? -8 : 0;
  const rainPenalty = sim.weather === 1 ? -5 : 0;
  const attractionBonus = Object.values(sim.built).reduce((a, b) => a + b, 0) * 1.5;
  sim.happiness += (82 + attractionBonus + nightPenalty + rainPenalty - sim.happiness) * dt * 0.08;
  const earn = sim.guests * (0.9 + sim.happiness / 130) * dt * 5.5;
  sim.cash += earn;
  sim.income += earn;
  sim.nextEvent -= dt;
  if (sim.nextEvent <= 0) {
    const events = [
      'IFS 熊猫墙打卡热度上升，游客流向西区',
      '春熙路巡游车队通过主街，商铺收入提高',
      '太古里广场出现排队峰值，满意度轻微波动',
      '大慈寺附近变成安静休息区，家庭游客停留更久',
      '地铁口新增客流，园区入口压力上升'
    ];
    log(events[Math.floor(Math.random() * events.length)]);
    sim.nextEvent = 9 + Math.random() * 9;
  }
}

function updateSpecialCameras(dt) {
  if (sim.activeView === 'ride') {
    sim.rideCameraT = (sim.rideCameraT + dt * 0.04) % 1;
    const p = coaster.curve.getPointAt(sim.rideCameraT);
    const ahead = coaster.curve.getPointAt((sim.rideCameraT + 0.03) % 1);
    camera.position.lerp(new THREE.Vector3(p.x, p.y + 5, p.z + 8), 0.08);
    controls.target.lerp(ahead, 0.1);
  } else if (sim.activeView === 'cinematic') {
    sim.cinematicT += dt * 0.13;
    const r = 105;
    camera.position.lerp(new THREE.Vector3(Math.cos(sim.cinematicT) * r, 48 + Math.sin(sim.cinematicT * 0.7) * 18, Math.sin(sim.cinematicT) * r), 0.04);
    controls.target.lerp(new THREE.Vector3(4, 8, 4), 0.04);
  }
}

let last = performance.now();
log('园区开门：太古里商业街、春熙路主街和大慈寺片区开始运营');
log('鼠标可旋转、缩放和平移摄像机');
updateHud();

function tick(now) {
  const rawDt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const dt = sim.paused ? 0 : rawDt * sim.speed;
  if (dt > 0) {
    sim.time = (sim.time + dt * 0.08) % 24;
    updateAnimated(dt);
    updateGuests(dt);
    updateEconomy(dt);
  }
  updateLighting();
  updateSpecialCameras(rawDt);
  controls.update();
  updateHud();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('keydown', e => {
  const keys = { '1': 'orbit', '2': 'top', '3': 'street', '4': 'ride', '5': 'cinematic', '6': 'temple' };
  if (keys[e.key]) setView(keys[e.key]);
  if (e.code === 'Space') ui.pause.click();
});

requestAnimationFrame(tick);
</script>
