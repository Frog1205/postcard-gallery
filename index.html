<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI文创作品展</title>
<style>
  :root {
    --warm-bg: #FDF6E3;
    --card-bg: #FFF8E7;
    --accent: #E8A02C;
    --red: #B8332C;
    --brown: #7A4A1A;
    --blue: #2C5F8D;
    --light-line: #E8D9B0;
    --text: #4A3F35;
    --shadow: rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--warm-bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    background: linear-gradient(135deg, #2C5F8D 0%, #B8332C 50%, #E8A02C 100%);
    padding: 40px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .site-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.05) 0px,
      rgba(255,255,255,0.05) 2px,
      transparent 2px,
      transparent 40px
    );
  }
  .site-header h1 {
    font-size: 2.4rem;
    color: white;
    letter-spacing: 6px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    position: relative;
  }
  .site-header p {
    color: rgba(255,255,255,0.85);
    margin-top: 8px;
    font-size: 1rem;
    letter-spacing: 2px;
    position: relative;
  }
  .flag-bar {
    display: flex;
    height: 4px;
    margin-top: 20px;
    border-radius: 2px;
    overflow: hidden;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
    position: relative;
  }
  .flag-bar span { flex: 1; }
  .fb1 { background: #2C5F8D; }
  .fb2 { background: #FFFFFF; }
  .fb3 { background: #B8332C; }
  .fb4 { background: #2E7D4A; }
  .fb5 { background: #E8A02C; }

  /* ── Toolbar ── */
  .toolbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn-scan {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .btn-scan svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
  .btn-scan-badge {
    background: var(--blue);
    box-shadow: 0 2px 8px rgba(44,95,141,0.3);
  }
  .btn-scan-badge:hover {
    background: #234D73;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(44,95,141,0.4);
  }
  .btn-scan-postcard {
    background: var(--red);
    box-shadow: 0 2px 8px rgba(184,51,44,0.3);
  }
  .btn-scan-postcard:hover {
    background: #9A2820;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(184,51,44,0.4);
  }
  .stats {
    font-size: 0.88rem;
    color: #8A7B5C;
    letter-spacing: 1px;
  }
  .stats strong { color: var(--red); font-size: 1.05rem; }
  .toolbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .view-toggle {
    display: flex;
    gap: 4px;
    background: white;
    border-radius: 8px;
    padding: 4px;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .view-btn {
    padding: 7px 14px;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 6px;
    font-size: 0.85rem;
    color: var(--brown);
    transition: all 0.2s;
  }
  .view-btn.active { background: var(--accent); color: white; }
  .btn-print {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    box-shadow: 0 1px 4px var(--shadow);
  }
  .btn-print:hover { transform: translateY(-1px); }
  .btn-print:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
  .btn-print svg { width: 16px; height: 16px; fill: currentColor; }
  .btn-print-postcard { background: var(--brown); }
  .btn-print-postcard:hover { background: #5C4A30; }
  .btn-print-badge { background: var(--blue); }
  .btn-print-badge:hover { background: #234D73; }

  /* ── Tab Bar ── */
  .tab-bar {
    max-width: 1200px;
    margin: 16px auto 0;
    padding: 0 20px;
    display: flex;
    border-bottom: 2px solid var(--light-line);
  }
  .tab-btn {
    padding: 10px 28px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    color: #8A7B5C;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn.active { color: var(--red); border-bottom-color: var(--red); }
  .tab-btn:hover:not(.active) { color: var(--text); }
  .tab-badge-indicator {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    background: var(--accent);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    border-radius: 10px;
    padding: 0 5px;
  }
  .tab-btn:not(.active) .tab-badge-indicator { background: #C9B98F; }

  /* ── Badge Gallery ── */
  .badge-gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    justify-content: flex-start;
  }
  .badge-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    cursor: pointer;
  }
  .badge-circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px dashed var(--red);
    background: #E8DFC7;
    position: relative;
    transition: all 0.3s ease;
    box-shadow: 0 4px 16px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8A7B5C;
    font-size: 0.78rem;
    text-align: center;
  }
  .badge-circle img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }
  .badge-card:hover .badge-circle {
    transform: scale(1.06) rotate(2deg);
    box-shadow: 0 10px 28px rgba(184,51,44,0.25);
    border-color: var(--accent);
    border-style: solid;
  }
  .badge-card:hover .badge-circle img { transform: scale(1.1); }
  .badge-name {
    font-size: 0.88rem;
    color: var(--brown);
    font-weight: 700;
    max-width: 150px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.5px;
  }
  .badge-num-tag {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 22px;
    height: 22px;
    background: var(--accent);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Postcard Gallery ── */
  .gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 28px;
  }
  .gallery.list-view {
    grid-template-columns: 1fr;
    max-width: 800px;
  }

  .postcard {
    background: var(--card-bg);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px var(--shadow);
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
  }
  .postcard:hover {
    transform: translateY(-4px) rotate(-0.5deg);
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  }
  .postcard-img-wrap {
    position: relative;
    width: 100%;
    padding-top: 66%;
    overflow: hidden;
    background: #E8DFC7;
  }
  .postcard-img-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  .postcard:hover .postcard-img-wrap img { transform: scale(1.05); }
  .postcard-border {
    position: absolute;
    inset: 6px;
    border: 2px solid rgba(232,160,44,0.5);
    border-radius: 4px;
    pointer-events: none;
    z-index: 1;
  }
  .postcard-info {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .postcard-title { font-weight: 700; color: var(--red); font-size: 1rem; letter-spacing: 1px; }
  .postcard-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: var(--accent);
    color: white;
    font-size: 0.8rem;
    font-weight: 700;
    border-radius: 50%;
  }
  .postcard-flag { display: flex; height: 3px; overflow: hidden; }
  .postcard-flag span { flex: 1; }
  .stamp-deco {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 44px;
    height: 54px;
    background: rgba(255,255,255,0.85);
    border: 1.5px dashed var(--red);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--red);
    text-align: center;
    line-height: 1.3;
    z-index: 2;
    backdrop-filter: blur(4px);
  }

  /* ── Empty State ── */
  .empty-state {
    grid-column: 1 / -1;
    max-width: 500px;
    margin: 60px auto;
    text-align: center;
    padding: 60px 30px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 4px 20px var(--shadow);
  }
  .badge-gallery .empty-state { margin: 60px auto; }
  .empty-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.6; }
  .empty-state h2 { color: var(--brown); margin-bottom: 12px; font-size: 1.3rem; }
  .empty-state p { color: #8A7B5C; line-height: 1.8; font-size: 0.95rem; }

  /* ── Hidden ── */
  .hidden { display: none !important; }

  /* ── Badge Lightbox ── */
  .badge-lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 40px;
    backdrop-filter: blur(8px);
  }
  .badge-lightbox.active { display: flex; }
  .badge-lb-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: lbIn 0.3s ease;
  }
  .badge-lb-circle {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px dashed rgba(232,160,44,0.8);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .badge-lb-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge-lb-title { color: white; font-size: 1.4rem; font-weight: 700; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .badge-lb-meta { color: rgba(255,255,255,0.7); font-size: 0.9rem; }

  /* ── Postcard Lightbox ── */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 40px;
    backdrop-filter: blur(8px);
  }
  .lightbox.active { display: flex; }
  .lightbox-inner {
    max-width: 900px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: lbIn 0.3s ease;
  }
  @keyframes lbIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .lightbox-img {
    width: 100%;
    max-height: 65vh;
    object-fit: contain;
    background: #E8DFC7;
    display: block;
  }
  .lightbox-detail {
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .lightbox-detail h3 { color: var(--red); font-size: 1.3rem; letter-spacing: 2px; }
  .lightbox-detail .lb-meta { color: #8A7B5C; font-size: 0.9rem; }
  .lb-close {
    position: fixed;
    top: 20px; right: 24px;
    width: 44px; height: 44px;
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    color: white;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1001;
    transition: all 0.2s;
  }
  .lb-close:hover { background: var(--red); border-color: var(--red); }
  .lb-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px; height: 48px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 1.4rem;
    cursor: pointer;
    z-index: 1001;
    transition: all 0.2s;
  }
  .lb-nav:hover { background: rgba(255,255,255,0.3); }
  .lb-prev { left: 16px; }
  .lb-next { right: 16px; }
  .lb-back-preview {
    border-top: 1px dashed var(--light-line);
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    min-height: 140px;
  }
  .lb-back-divider { background: var(--accent); width: 1px; }
  .lb-msg-area { padding-right: 16px; }
  .lb-msg-title { color: var(--red); font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
  .lb-msg-lines {
    height: 80px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 22px, #E8D9B0 22px, #E8D9B0 22.5px);
  }
  .lb-addr-area { padding-left: 16px; position: relative; }
  .lb-stamp {
    position: absolute; top: 0; right: 0;
    width: 40px; height: 50px;
    border: 1.5px dashed var(--red);
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; color: var(--red);
  }
  .lb-to { font-size: 0.85rem; color: var(--red); font-weight: 700; letter-spacing: 1px; }
  .lb-addr-lines {
    margin-top: 30px;
    height: 50px;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 22px, #C9B98F 22px, #C9B98F 22.5px);
  }

  /* ── Footer ── */
  .site-footer {
    text-align: center;
    padding: 30px 20px;
    color: #8A7B5C;
    font-size: 0.85rem;
    letter-spacing: 1px;
  }

  /* ── Postcard Print Overlay ── */
  .print-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }
  .print-overlay.active { display: block; }
  .print-toolbar {
    position: sticky;
    top: 0; z-index: 2001;
    background: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .print-toolbar h3 { color: var(--red); font-size: 1.1rem; letter-spacing: 1px; }
  .print-toolbar-btns { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .print-range {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    font-size: 0.85rem;
  }
  .print-range input {
    width: 64px;
    padding: 7px 8px;
    border: 1px solid #D8CCAA;
    border-radius: 6px;
    font: inherit;
  }
  .print-toolbar .pt-btn {
    padding: 8px 24px;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .pt-btn-print { background: var(--red); color: white; }
  .pt-btn-print:hover { background: #9A2820; }
  .pt-btn-close { background: #eee; color: var(--text); }
  .pt-btn-close:hover { background: #ddd; }
  .print-pages {
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding-bottom: 40px;
  }
  .print-page {
    width: 148mm;
    height: 105mm;
    background: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    box-sizing: border-box;
  }
  .print-page-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.7);
    margin-bottom: 4px;
    text-align: center;
  }
  .print-summary {
    width: min(148mm, calc(100vw - 40px));
    padding: 12px 16px;
    color: white;
    background: rgba(0,0,0,0.35);
    border-radius: 6px;
    font-size: 0.9rem;
    line-height: 1.6;
    text-align: center;
  }
  .print-summary b { color: #FFE3A3; }
  .print-pair { display: flex; flex-direction: column; align-items: center; gap: 4px; }

  /* Postcard front/back print */
  .prt-front {
    background: #FFF8E7;
    padding: 4mm;
    display: flex;
    flex-direction: column;
    width: 100%; height: 100%;
    box-sizing: border-box;
  }
  .prt-front-image {
    flex: 1;
    background-color: #E8DFC7;
    border: 1px solid #E8A02C;
    border-radius: 2mm;
    overflow: hidden;
    position: relative;
  }
  .prt-front-image img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .prt-front-strip {
    margin-top: 2mm;
    height: 6mm;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2mm;
    font-size: 8pt;
    color: #7A4A1A;
  }
  .prt-front-strip .prt-title { font-weight: 700; color: #B8332C; letter-spacing: 1px; }
  .prt-front-strip .prt-flag { display: flex; height: 3mm; width: 30mm; border-radius: 1mm; overflow: hidden; }
  .prt-front-strip .prt-flag span { flex: 1; }
  .prt-back {
    background: #FFFBF0;
    padding: 5mm 6mm;
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    width: 100%; height: 100%;
    box-sizing: border-box;
  }
  .prt-back-divider { background: #E8A02C; width: 1px; }
  .prt-msg-area { padding-right: 4mm; display: flex; flex-direction: column; }
  .prt-msg-title { color: #B8332C; font-size: 10pt; font-weight: 700; margin-bottom: 2mm; letter-spacing: 1px; }
  .prt-msg-lines {
    flex: 1;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 7mm, #E8D9B0 7mm, #E8D9B0 7.2mm);
  }
  .prt-msg-foot { font-size: 8.5pt; color: #8A7B5C; text-align: right; margin-top: 2mm; font-style: italic; line-height: 1.2; }
  .prt-addr-area { padding-left: 4mm; display: flex; flex-direction: column; position: relative; }
  .prt-stamp {
    position: absolute; top: 0; right: 0;
    width: 22mm; height: 28mm;
    border: 1.5px dashed #B8332C;
    color: #B8332C;
    font-size: 7pt;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.4; border-radius: 1mm;
  }
  .prt-to-label { font-size: 10pt; color: #B8332C; font-weight: 700; margin-bottom: 2mm; letter-spacing: 1px; }
  .prt-addr-lines {
    margin-top: 16mm; flex: 1;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 8mm, #C9B98F 8mm, #C9B98F 8.2mm);
    max-height: 38mm;
  }
  .prt-postcode { margin-top: 5mm; display: flex; gap: 1.2mm; }
  .prt-postcode .prt-box { width: 7mm; height: 9mm; border: 1px solid #B8332C; border-radius: 0.5mm; }
  .prt-course-foot { margin-top: auto; padding-top: 2mm; font-size: 8.5pt; color: #8A7B5C; text-align: right; letter-spacing: 0.2px; line-height: 1.2; font-style: italic; }

  /* ── Postcard @page & print ── */
  /* ── Badge Print Overlay ── */
  .badge-print-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 2000;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }

<script>
let cards   = [];   // postcard images
let badges  = [];   // badge images
let currentLbIndex = -1;
let currentTab = 'badge';
let printDocumentUrls = [];

/* ── Filename Parser ── */
function parseFilename(name) {
  const base = name.replace(/\.\w+$/, '');
  const match = base.match(/^(.+?)[-_](\d+)$/);
  if (match) return { description: match[1], number: parseInt(match[2], 10) };
  return { description: base, number: 0 };
}

/* ── Tab Switch ── */
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabBadgeBtn').classList.toggle('active', tab === 'badge');
  document.getElementById('tabPostcardBtn').classList.toggle('active', tab === 'postcard');
  document.getElementById('badgeGallery').classList.toggle('hidden', tab !== 'badge');
  document.getElementById('gallery').classList.toggle('hidden', tab !== 'postcard');
  document.getElementById('viewToggle').style.display = tab === 'postcard' ? '' : 'none';
  updateStats();
}

function updateTabCounts() {
  document.getElementById('badgeTabCount').textContent = badges.length;
  document.getElementById('postcardTabCount').textContent = cards.length;
}

function updateStats() {
  const el = document.getElementById('stats');
  if (currentTab === 'badge') {
    el.innerHTML = badges.length > 0
      ? '共 <strong>' + badges.length + '</strong> 枚徽章'
      : '';
  } else {
    if (cards.length === 0) { el.textContent = ''; return; }
    const groups = new Set(cards.map(c => c.description));
    el.innerHTML = '共 <strong>' + cards.length + '</strong> 张作品 · <strong>' + groups.size + '</strong> 个系列';
  }
}

/* ── Scan Badge Folder ── */
async function scanBadgeFolder() {
  if (!('showDirectoryPicker' in window)) {
    alert('当前浏览器不支持文件夹选择，请使用 Chrome 或 Edge 浏览器。');
    return;
  }
  try {
    const dirHandle = await window.showDirectoryPicker();
    badges = [];
    const imageExts = ['.png', '.jpg', '.jpeg', '.webp', '.bmp', '.gif'];
    for await (const entry of dirHandle.values()) {
      if (entry.kind !== 'file') continue;
      const ext = entry.name.substring(entry.name.lastIndexOf('.')).toLowerCase();
      if (!imageExts.includes(ext)) continue;
      const file = await entry.getFile();
      const url  = URL.createObjectURL(file);
      const parsed = parseFilename(entry.name);
      badges.push({ filename: entry.name, file, url, description: parsed.description, number: parsed.number, size: file.size });
    }
    badges.sort((a, b) => {
      if (a.description !== b.description) return a.description.localeCompare(b.description, 'zh');
      return a.number - b.number;
    });
    renderBadgeGallery();
    document.getElementById('btnPrintBadge').disabled = badges.length === 0;
    switchTab('badge');
    updateTabCounts();
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

/* ── Scan Postcard Folder ── */
async function scanPostcardFolder() {
  if (!('showDirectoryPicker' in window)) {
    alert('当前浏览器不支持文件夹选择，请使用 Chrome 或 Edge 浏览器。');
    return;
  }
  try {
    const dirHandle = await window.showDirectoryPicker();
    cards = [];
    const imageExts = ['.png', '.jpg', '.jpeg', '.webp', '.bmp', '.gif'];
    for await (const entry of dirHandle.values()) {
      if (entry.kind !== 'file') continue;
      const ext = entry.name.substring(entry.name.lastIndexOf('.')).toLowerCase();
      if (!imageExts.includes(ext)) continue;
      const file = await entry.getFile();
      const url  = URL.createObjectURL(file);
      const parsed = parseFilename(entry.name);
      cards.push({ filename: entry.name, file, url, description: parsed.description, number: parsed.number, size: file.size });
    }
    cards.sort((a, b) => {
      if (a.description !== b.description) return a.description.localeCompare(b.description, 'zh');
      return a.number - b.number;
    });
    cards.forEach((card, index) => {
      card.printCode = 'PC-' + String(index + 1).padStart(3, '0');
    });
    renderGallery();
    document.getElementById('btnPrint').disabled = cards.length === 0;
    switchTab('postcard');
    updateTabCounts();
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

/* ── Render Badge Gallery ── */
function renderBadgeGallery() {
  const gallery = document.getElementById('badgeGallery');
  const empty   = document.getElementById('badgeEmptyState');
  if (badges.length === 0) {
    gallery.innerHTML = '';
    gallery.appendChild(empty);
    empty.style.display = '';
    return;
  }
  gallery.innerHTML = badges.map((badge, i) => `
    <div class="badge-card" onclick="openBadgeLightbox(${i})">
      <div class="badge-circle">
        <img src="${badge.url}" alt="${badge.description}" loading="lazy">
        ${badge.number ? '<div class="badge-num-tag">' + badge.number + '</div>' : ''}
      </div>
      <div class="badge-name">${badge.description}</div>
    </div>
  `).join('');
  updateStats();
}

/* ── Render Postcard Gallery ── */
function renderGallery() {
  const gallery = document.getElementById('gallery');
  const empty   = document.getElementById('emptyState');
  if (cards.length === 0) {
    gallery.innerHTML = '';
    gallery.appendChild(empty);
    empty.style.display = '';
    updateStats();
    return;
  }
  gallery.innerHTML = cards.map((card, i) => `
    <div class="postcard" onclick="openLightbox(${i})">
      <div class="postcard-img-wrap">
        <img src="${card.url}" alt="${card.description}" loading="lazy">
        <div class="postcard-border"></div>
        <div class="stamp-deco">邮票<br>STAMP</div>
      </div>
      <div class="postcard-flag">
        <span class="fb1"></span><span class="fb2"></span><span class="fb3"></span><span class="fb4"></span><span class="fb5"></span>
      </div>
      <div class="postcard-info">
        <span class="postcard-title">${card.description}</span>
        <span class="postcard-num">${card.number || '#'}</span>
      </div>
    </div>
  `).join('');
  updateStats();
}

function setView(mode) {
  const gallery = document.getElementById('gallery');
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === mode));
  gallery.classList.toggle('list-view', mode === 'list');
}

/* ── Badge Lightbox ── */
function openBadgeLightbox(index) {
  const badge = badges[index];
  document.getElementById('blbImg').src   = badge.url;
  document.getElementById('blbTitle').textContent = badge.description + (badge.number ? ' · No.' + badge.number : '');
  document.getElementById('blbMeta').textContent  = badge.filename;
  document.getElementById('badgeLightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeBadgeLightbox() {
  document.getElementById('badgeLightbox').classList.remove('active');
  document.body.style.overflow = '';
}

/* ── Postcard Lightbox ── */
function openLightbox(index) {
  currentLbIndex = index;
  const card = cards[index];
  document.getElementById('lbImg').src   = card.url;
  document.getElementById('lbTitle').textContent = card.description;
  document.getElementById('lbMeta').textContent  = card.filename;
  document.getElementById('lbNum').textContent   = card.number || '#';
  document.getElementById('lightbox').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
  currentLbIndex = -1;
}
function navLightbox(dir) {
  if (cards.length === 0) return;
  currentLbIndex = (currentLbIndex + dir + cards.length) % cards.length;
  const card = cards[currentLbIndex];
  document.getElementById('lbImg').src   = card.url;
  document.getElementById('lbTitle').textContent = card.description;
  document.getElementById('lbMeta').textContent  = card.filename;
  document.getElementById('lbNum').textContent   = card.number || '#';
}
document.addEventListener('keydown', e => {
  if (currentLbIndex >= 0) {
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowLeft')   navLightbox(-1);
    if (e.key === 'ArrowRight')  navLightbox(1);
  }
  if (document.getElementById('badgeLightbox').classList.contains('active')) {
    if (e.key === 'Escape') closeBadgeLightbox();
  }
});
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLightbox();
});

/* ── Page size helper (dynamic @page injection) ── */
function setPageSize(size) {
  let s = document.getElementById('dynamic-page-style');
  if (!s) { s = document.createElement('style'); s.id = 'dynamic-page-style'; document.head.appendChild(s); }
  s.textContent = `@page { size: ${size}; margin: 0; }`;
}

/* ── Badge Print (overlay, A4 2×3) ── */
function openBadgePrint() {
  if (badges.length === 0) return;

  const posClasses = ['bap1','bap2','bap3','bap4','bap5','bap6'];
  const groups = [];
  for (let i = 0; i < badges.length; i += 6) groups.push(badges.slice(i, i + 6));
  const totalPages = groups.length;

  const container = document.getElementById('badgePrintPages');
  container.innerHTML = groups.map((group, pi) => {
    const badgesHTML = group.map((badge, pos) => `
      <div class="badge-on-page ${posClasses[pos]}">
        <img src="${badge.url}" alt="${badge.description}">
      </div>
    `).join('');
    return `
      <div class="badge-print-pair">
        <span class="print-page-label">
          第 ${pi + 1} 页 · 徽章 ${pi * 6 + 1}–${Math.min(pi * 6 + 6, badges.length)}
        </span>
        <div class="badge-print-a4">
          <div class="badge-corner-info">
            <b>AI 文创作品展</b> ｜ 58mm 徽章 · A4 拼版 · 第 ${pi + 1} 张
          </div>
          ${badgesHTML}
          <div class="badge-page-no">A4-${String(pi + 1).padStart(2,'0')} / 共 ${totalPages} 张</div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('badgePrintOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function buildBadgePrintHTML(printBadges = badges) {
  const posClasses = ['bap1','bap2','bap3','bap4','bap5','bap6'];
  const groups = [];
  for (let i = 0; i < printBadges.length; i += 6) groups.push(printBadges.slice(i, i + 6));
  const totalPages = groups.length;

  return groups.map((group, pi) => {
    const badgesHTML = group.map((badge, pos) => `
      <div class="badge-on-page ${posClasses[pos]}">
        <img src="${badge.url}" alt="${badge.description}">
      </div>
    `).join('');
    return `
      <div class="badge-print-a4">
        <div class="badge-corner-info">
          <b>AI 文创作品展</b> ｜ 58mm 徽章 · A4 拼版 · 第 ${pi + 1} 张
        </div>
        ${badgesHTML}
        <div class="badge-page-no">A4-${String(pi + 1).padStart(2,'0')} / 共 ${totalPages} 张</div>
      </div>
    `;
  }).join('');
}

function closeBadgePrintPreview() {
  document.getElementById('badgePrintOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

function imageBitmapToPrintDataURL(bitmap, maxWidth = 1800, maxHeight = 1280, quality = 0.88) {
  const scale = Math.min(1, maxWidth / bitmap.width, maxHeight / bitmap.height);
  const width = Math.max(1, Math.round(bitmap.width * scale));
  const height = Math.max(1, Math.round(bitmap.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, height);
  ctx.drawImage(bitmap, 0, 0, width, height);
  return canvas.toDataURL('image/jpeg', quality);
}

async function fileToPrintDataURL(file) {
  if (window.createImageBitmap) {
    const bitmap = await createImageBitmap(file);
    const dataURL = imageBitmapToPrintDataURL(bitmap);
    if (bitmap.close) bitmap.close();
    return dataURL;
  }

  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = url;
    });
    return imageBitmapToPrintDataURL(img);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function preparePrintImages(items, onProgress) {
  const prepared = [];
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    if (onProgress) onProgress(i + 1, items.length);
    if (!item.file) {
      prepared.push(item);
    } else {
      prepared.push({ ...item, url: await fileToPrintDataURL(item.file) });
    }
  }
  return prepared;
}

async function doBadgePrint() {

  }
}

function openPreparingWindow(title) {
  const printWin = window.open('', '_blank');
  if (!printWin) {
    alert('浏览器拦截了打印窗口，请允许弹出窗口后重试。');
    return null;
  }
  printWin.document.open();
  printWin.document.write(`<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>${title}</title></head>
<body style="margin:0;background:#E5E7EB;font-family:sans-serif;color:#4A3F35;">
  <div style="padding:28px;font-size:16px;">正在准备打印图片...</div>
</body>
</html>`);
  printWin.document.close();
  return printWin;
}

function openPrintDocument(title, css, bodyHTML, guideHTML, targetWindow) {
  const printWin = targetWindow || openPreparingWindow(title);
  if (!printWin) return;
  const html = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>${title}</title>
<style>${css}</style>
</head>
<body>
<div class="print-shell">
  <div class="print-guide">
    <div>${guideHTML}</div>
    <button id="startPrintBtn" onclick="startPrint()">开始打印</button>
  </div>
  <div class="print-content">
    ${bodyHTML}
  </div>
</div>
<script>
  function waitForImages() {
    return Promise.all(Array.from(document.images).map(function(img, index) {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve(null);
      return new Promise(function(resolve) {
        img.onload = function() { resolve(null); };
        img.onerror = function() { resolve(index + 1); };
      });
    })).then(function(results) {
      return results.filter(Boolean);
    });
  }
  function startPrint() {
    var btn = document.getElementById('startPrintBtn');
    btn.disabled = true;
    btn.textContent = '图片加载中...';
    waitForImages().then(function(failedImages) {
      if (failedImages.length > 0) {
        btn.textContent = '开始打印';
        btn.disabled = false;
        alert('有 ' + failedImages.length + ' 张图片没有加载完成，请关闭本页后重新生成打印页。');
        return;
      }
      btn.textContent = '开始打印';
      btn.disabled = false;
      window.focus();
      window.print();
    });
  }
  window.addEventListener('load', function() { window.focus(); });
<\/script>
</body>
</html>`;
  const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
  printDocumentUrls.push(url);
  if (printDocumentUrls.length > 4) {
    URL.revokeObjectURL(printDocumentUrls.shift());
  }
  printWin.location.replace(url);
}

function getPrintRangeCards() {
  const startInput = document.getElementById('printStart');

  const from = Math.min(start, end);
  const to = Math.max(start, end);
  startInput.value = from;

  return { from, to, selected: cards.slice(from - 1, to) };
}

function loadImageForCanvas(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function drawCoverImage(ctx, img, x, y, w, h) {
  const scale = Math.max(w / img.width, h / img.height);
  const sw = w / scale;
  const sh = h / scale;
  const sx = (img.width - sw) / 2;
  const sy = (img.height - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function roundedRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function canvasToJpegBytes(canvas, quality = 0.88) {
  const dataUrl = canvas.toDataURL('image/jpeg', quality);
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function jpegBytesToDataURL(bytes) {
  let binary = '';
  const chunkSize = 8192;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    const chunk = bytes.subarray(i, i + chunkSize);
    binary += String.fromCharCode.apply(null, chunk);
  }
  return 'data:image/jpeg;base64,' + btoa(binary);
}

async function renderFrontPage(card) {
  const pxPerMm = 300 / 25.4;
  const width = Math.round(148 * pxPerMm);
  const height = Math.round(105 * pxPerMm);
  const mm = pxPerMm;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  const img = await loadImageForCanvas(card.url);

  ctx.fillStyle = '#FFF8E7';
  ctx.fillRect(0, 0, width, height);

  const margin = 4 * mm;
  const stripH = 8 * mm;
  const gap = 2 * mm;
  const imageX = margin;
  const imageY = margin;
  const imageW = width - margin * 2;
  const imageH = height - margin * 2 - stripH - gap;
  const radius = 2 * mm;

  ctx.save();
  roundedRectPath(ctx, imageX, imageY, imageW, imageH, radius);
  ctx.clip();
  drawCoverImage(ctx, img, imageX, imageY, imageW, imageH);
  ctx.restore();

  ctx.strokeStyle = '#E8A02C';
  ctx.lineWidth = 1.4;
  roundedRectPath(ctx, imageX, imageY, imageW, imageH, radius);
  ctx.stroke();

  const stripY = imageY + imageH + gap;
  ctx.fillStyle = '#B8332C';
  ctx.font = 'bold 25px "Microsoft YaHei", sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(card.description, margin + 2 * mm, stripY + stripH / 2, 70 * mm);

  const barW = 30 * mm;
  const barH = 3 * mm;
  const barX = (width - barW) / 2;
  const barY = stripY + (stripH - barH) / 2;
  ['#2C5F8D', '#FFFFFF', '#B8332C', '#2E7D4A', '#E8A02C'].forEach((color, i) => {
    ctx.fillStyle = color;
    ctx.fillRect(barX + i * barW / 5, barY, barW / 5, barH);
  });

  ctx.fillStyle = '#7A4A1A';
  ctx.font = '23px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText((card.printCode || '#') + ' · #2026', width - margin - 2 * mm, stripY + stripH / 2);

  return canvasToJpegBytes(canvas);
}

function drawDashedRect(ctx, x, y, w, h, dash, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.setLineDash(dash);
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

async function renderBackPage(card) {
  const pxPerMm = 300 / 25.4;
  const width = Math.round(148 * pxPerMm);
  const height = Math.round(105 * pxPerMm);
  const mm = pxPerMm;
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FFFBF0';
  ctx.fillRect(0, 0, width, height);

  const left = 6 * mm;
  const top = 5 * mm;
  const bottom = height - 5 * mm;
  const midX = width / 2;

  ctx.strokeStyle = '#E8A02C';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(midX, top);
  ctx.lineTo(midX, bottom);
  ctx.stroke();

  ctx.strokeStyle = '#E8D9B0';
  ctx.lineWidth = 1.5;
  for (let y = top + 12 * mm; y < bottom - 10 * mm; y += 7 * mm) {
    ctx.beginPath();
    ctx.moveTo(left, y);
    ctx.lineTo(midX - 4 * mm, y);
    ctx.stroke();
  }

  const rightX = midX + 4 * mm;
  ctx.fillStyle = '#B8332C';
  ctx.font = 'bold 32px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('TO · 寄给谁', rightX, top + 6 * mm);

  const stampW = 22 * mm;
  const stampH = 28 * mm;
  const stampX = width - 6 * mm - stampW;
  const stampY = top;
  drawDashedRect(ctx, stampX, stampY, stampW, stampH, [6, 4], '#B8332C');
  ctx.font = '22px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('邮票', stampX + stampW / 2, stampY + stampH / 2 - 5);
  ctx.fillText('STAMP', stampX + stampW / 2, stampY + stampH / 2 + 18);

  ctx.strokeStyle = '#C9B98F';
  ctx.lineWidth = 1.5;
  for (let y = top + 32 * mm; y < bottom - 31 * mm; y += 8 * mm) {
    ctx.beginPath();
    ctx.moveTo(rightX, y);
    ctx.lineTo(width - 6 * mm, y);
    ctx.stroke();
  }

  const boxSize = 7 * mm;
  const boxGap = 1.2 * mm;
  const postcodeY = bottom - 20 * mm;
  ctx.strokeStyle = '#B8332C';
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    ctx.strokeRect(rightX + i * (boxSize + boxGap), postcodeY, boxSize, 9 * mm);
  }

  ctx.fillStyle = '#8A7B5C';
  ctx.font = 'italic 22px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('AI 文创课 · 明信片作品 · 2026', width - 6 * mm, bottom - 3 * mm);

  ctx.font = 'italic 22px "Microsoft YaHei", sans-serif';
  ctx.fillText('—— ' + card.description + ' · ' + (card.printCode || '#'), midX - 4 * mm, bottom - 3 * mm);

  return canvasToJpegBytes(canvas);
}

async function buildPdfBytesForCards(selectedCards, onProgress) {
  const pageImages = [];
  for (let i = 0; i < selectedCards.length; i++) {
    const card = selectedCards[i];
    if (onProgress) onProgress(i + 1, selectedCards.length, '正面');
    pageImages.push(await renderFrontPage(card));
    if (onProgress) onProgress(i + 1, selectedCards.length, '背面');
    pageImages.push(await renderBackPage(card));
  }
  return buildImagePdf(pageImages, 148 * 72 / 25.4, 105 * 72 / 25.4);
}

async function renderTwoUpSheet(leftBytes, rightBytes) {
  const pxPerMm = 300 / 25.4;
  const sheetW = Math.round(210 * pxPerMm);
  const sheetH = Math.round(148 * pxPerMm);
  const slotW = sheetW / 2;
  const canvas = document.createElement('canvas');
  canvas.width = sheetW;
  canvas.height = sheetH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, sheetW, sheetH);

  const drawSlot = async (bytes, slotIndex) => {
    if (!bytes) return;
    const img = await loadImageForCanvas(jpegBytesToDataURL(bytes));
    const slotX = slotIndex * slotW;
    ctx.save();
    ctx.translate(slotX + slotW, 0);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(img, 0, 0, sheetH, slotW);
    ctx.restore();
  };

  await drawSlot(leftBytes, 0);
  await drawSlot(rightBytes, 1);

  ctx.strokeStyle = '#C9B98F';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]);
  ctx.beginPath();
  ctx.moveTo(slotW, 0);
  ctx.lineTo(slotW, sheetH);
  ctx.stroke();
  ctx.setLineDash([]);

  return canvasToJpegBytes(canvas, 0.9);
}

async function buildTwoUpPdfBytesForCards(selectedCards, onProgress) {
  const sheetImages = [];
  for (let i = 0; i < selectedCards.length; i += 2) {
    const left = selectedCards[i];
    const right = selectedCards[i + 1];
    const pairNo = Math.floor(i / 2) + 1;
    const pairTotal = Math.ceil(selectedCards.length / 2);

    if (onProgress) onProgress(pairNo, pairTotal, '正面');
    const leftFront = await renderFrontPage(left);
    const rightFront = right ? await renderFrontPage(right) : null;
    sheetImages.push(await renderTwoUpSheet(leftFront, rightFront));

    if (onProgress) onProgress(pairNo, pairTotal, '背面');
    const leftBack = await renderBackPage(left);
    const rightBack = right ? await renderBackPage(right) : null;
    sheetImages.push(await renderTwoUpSheet(leftBack, rightBack));
  }
  return buildImagePdf(sheetImages, 210 * 72 / 25.4, 148 * 72 / 25.4, Math.round(210 * 300 / 25.4), Math.round(148 * 300 / 25.4));
}

function pdfText(str) {
  return str.replace(/[\\()]/g, '\\$&');
}

function buildImagePdf(imageBytesList, pageW, pageH, imageW = Math.round(148 * 300 / 25.4), imageH = Math.round(105 * 300 / 25.4)) {
  const objects = [];
  const addObject = content => {
    objects.push(content);
    return objects.length;
  };

  const catalogId = addObject('<< /Type /Catalog /Pages 2 0 R >>');
  const pagesId = addObject('');
  const pageIds = [];

  imageBytesList.forEach((jpegBytes, index) => {
    const imageId = addObject({
      bytes: jpegBytes,
      dict: `<< /Type /XObject /Subtype /Image /Width ${imageW} /Height ${imageH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>`
    });
    const content = `q\n${pageW.toFixed(3)} 0 0 ${pageH.toFixed(3)} 0 0 cm\n/Im${index + 1} Do\nQ\n`;
    const contentBytes = new TextEncoder().encode(content);
    const contentId = addObject({
      bytes: contentBytes,
      dict: `<< /Length ${contentBytes.length} >>`
    });
    const pageId = addObject(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pageW.toFixed(3)} ${pageH.toFixed(3)}] /Resources << /XObject << /Im${index + 1} ${imageId} 0 R >> >> /Contents ${contentId} 0 R >>`);
    pageIds.push(pageId);
  });

  objects[pagesId - 1] = `<< /Type /Pages /Count ${pageIds.length} /Kids [${pageIds.map(id => id + ' 0 R').join(' ')}] >>`;

  const chunks = [];
  const offsets = [0];
  let position = 0;
  const pushString = text => {
    const bytes = new TextEncoder().encode(text);
    chunks.push(bytes);
    position += bytes.length;
  };
  const pushBytes = bytes => {
    chunks.push(bytes);
    position += bytes.length;
  };

  pushString('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  objects.forEach((obj, i) => {
    offsets[i + 1] = position;
    pushString(`${i + 1} 0 obj\n`);
    if (typeof obj === 'string') {
      pushString(obj + '\n');
    } else {
      pushString(obj.dict + '\nstream\n');
      pushBytes(obj.bytes);
      pushString('\nendstream\n');
    }
    pushString('endobj\n');
  });

  const xrefOffset = position;
  pushString(`xref\n0 ${objects.length + 1}\n`);
  pushString('0000000000 65535 f \n');
  for (let i = 1; i <= objects.length; i++) {
    pushString(String(offsets[i]).padStart(10, '0') + ' 00000 n \n');
  }
  pushString(`trailer\n<< /Size ${objects.length + 1} /Root ${catalogId} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`);

  const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
  const result = new Uint8Array(total);
  let offset = 0;
  chunks.forEach(chunk => {
    result.set(chunk, offset);
    offset += chunk.length;
  });
  return result;
}

function downloadBytes(bytes, filename, mimeType) {
  const blob = new Blob([bytes], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function openPrintPreview() {
  if (cards.length === 0) return;
  const previewLimit = 3;
  const previewCards = cards.slice(0, previewLimit);
  const container = document.getElementById('printPages');
  const endInput = document.getElementById('printEnd');
  endInput.max = cards.length;
  endInput.value = Math.min(10, cards.length);
  document.getElementById('printStart').max = cards.length;
  const summary = cards.length > previewLimit
    ? `<div class="print-summary">预览仅显示前 ${previewLimit} 张样张。为加快打印预览，默认只打印 <b>1-${Math.min(10, cards.length)}</b> 张；可在右上角改范围分批打印。全部 ${cards.length} 张共 ${cards.length * 2} 页。</div>`
    : '';
  container.innerHTML = summary + previewCards.map((card, i) => `
    <div class="print-pair">
      <span class="print-page-label">第 ${i + 1} 张 ·「${card.description}」· 正面</span>
      <div class="print-page">${buildFrontHTML(card)}</div>
      <span class="print-page-label">第 ${i + 1} 张 ·「${card.description}」· 背面</span>
      <div class="print-page">${buildBackHTML(card)}</div>
    </div>
  `).join('');
  document.getElementById('printOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closePrintPreview() {
  document.getElementById('printOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

      printWin

  }

async function renderBadgeSheet(badgesGroup, pageIndex, totalPages) {
  const pxPerMm = 300 / 25.4;
  const width = Math.round(210 * pxPerMm);
  const height = Math.round(297 * pxPerMm);
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, width, height);

  ctx.textBaseline = 'top';
  ctx.fillStyle = '#B8332C';
  ctx.font = `bold ${Math.round(3.0 * pxPerMm)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillText('AI 文创作品展', 6 * pxPerMm, 5 * pxPerMm);
  ctx.fillStyle = '#8A7B5C';
  ctx.font = `${Math.round(2.6 * pxPerMm)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.fillText(`58mm 徽章 · A4 拼版 · 第 ${pageIndex + 1} 张`, 6 * pxPerMm, 9.5 * pxPerMm);

  const pageLabel = `A4-${String(pageIndex + 1).padStart(2, '0')} / 共 ${totalPages} 张`;
  const labelW = ctx.measureText(pageLabel).width;
  ctx.fillText(pageLabel, width - 8 * pxPerMm - labelW, height - 9 * pxPerMm);

  const slots = [
    { x: 27.5, y: 31 }, { x: 107.5, y: 31 },
    { x: 27.5, y: 111 }, { x: 107.5, y: 111 },
    { x: 27.5, y: 191 }, { x: 107.5, y: 191 },
  ];
  const badgeSize = 75 * pxPerMm;

  for (let i = 0; i < badgesGroup.length; i++) {
    const badge = badgesGroup[i];
    const slot = slots[i];
    const x = slot.x * pxPerMm;
    const y = slot.y * pxPerMm;
    const cx = x + badgeSize / 2;
    const cy = y + badgeSize / 2;
    const r = badgeSize / 2;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.fillStyle = '#E8DFC7';
    ctx.fill();
    ctx.clip();
    const img = await loadImageForCanvas(badge.url);
    drawCoverImage(ctx, img, x, y, badgeSize, badgeSize);
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#B8332C';
    ctx.lineWidth = 0.4 * pxPerMm;
    ctx.setLineDash([3 * pxPerMm, 2 * pxPerMm]);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  return canvasToJpegBytes(canvas, 0.9);
}

async function buildBadgePdfBytes(selectedBadges, onProgress) {
  const groups = [];
  for (let i = 0; i < selectedBadges.length; i += 6) groups.push(selectedBadges.slice(i, i + 6));
  const sheetImages = [];
  for (let i = 0; i < groups.length; i++) {
    if (onProgress) onProgress(i + 1, groups.length);
    sheetImages.push(await renderBadgeSheet(groups[i], i, groups.length));
  }
  return buildImagePdf(
    sheetImages,
    210 * 72 / 25.4,
    297 * 72 / 25.4,
    Math.round(210 * 300 / 25.4),
    Math.round(297 * 300 / 25.4)
  );
}
